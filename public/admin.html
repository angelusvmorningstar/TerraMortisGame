<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terra Mortis — ST Admin</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Lato:wght@400;600;700;900&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/admin-layout.css">
<!-- Tickets surface sheet (ADR-008 D9). Static here, injected in index.html
     by the getRole()-gated load path. Asymmetry ends at P3 with admin.html. -->
<!-- Surface sheets (ADR-008 D9). Static here, injected in index.html by the
     getRole()-gated load path. admin-shared.css holds classes two or more
     admin surfaces emit. Asymmetry ends at P3 with admin.html. -->
<link rel="stylesheet" href="css/admin-shared.css">
<link rel="stylesheet" href="css/admin-attendance.css">
<link rel="stylesheet" href="css/admin-rule-data.css">
<link rel="stylesheet" href="css/admin-rules-engine.css">
<link rel="stylesheet" href="css/admin-equipment.css">
<link rel="stylesheet" href="css/admin-players.css">
<link rel="stylesheet" href="css/admin-spheres.css">
<link rel="stylesheet" href="css/admin-tickets.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Theme init: run before body renders to prevent flash -->
<script>
(function(){
  var t=localStorage.getItem('tm-theme');
  if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
})();
</script>
</head>
<body>

<!-- Login screen (hidden during OAuth callback to prevent flash) -->
<div id="login-screen" style="display:none">
  <div class="login-box">
    <div class="login-title">Terra Mortis</div>
    <div class="login-sub">ST Admin</div>
    <p class="login-desc">Storyteller access only. Log in with Discord to continue.</p>
    <button id="login-btn" class="login-discord-btn">
      <svg width="20" height="15" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0045.4.2a.2.2 0 00-.2.1 40.8 40.8 0 00-1.8 3.7 54 54 0 00-16.2 0A37.4 37.4 0 0025.4.3a.2.2 0 00-.2-.1A58.4 58.4 0 0010.5 5a.2.2 0 00-.1 0A60.4 60.4 0 00.3 45.3a.3.3 0 000 .2 58.7 58.7 0 0017.7 9a.2.2 0 00.3-.1 42 42 0 003.6-5.9.2.2 0 00-.1-.3 38.6 38.6 0 01-5.5-2.6.2.2 0 01 0-.4l1.1-.9a.2.2 0 01.2 0 41.9 41.9 0 0035.6 0 .2.2 0 01.2 0l1.1.9a.2.2 0 010 .3 36.3 36.3 0 01-5.5 2.7.2.2 0 00-.1.3 47.2 47.2 0 003.6 5.9.2.2 0 00.3 0A58.5 58.5 0 0070.3 45.5a.2.2 0 000-.2A60 60 0 0060.2 5a.2.2 0 00-.1 0zM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1c0 3.9-2.8 7.1-6.4 7.1zm23.6 0c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1c0 3.9-2.8 7.1-6.4 7.1z"/></svg>
      Log in with Discord
    </button>
    <p id="login-error" class="login-error"></p>
  </div>
</div>

<div id="admin-app" style="display:none">

  <button class="sb-open-btn" id="sb-open" title="Open menu">&#9776;</button>
  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Terra Mortis</div>
      <button class="sb-close-btn" id="sb-close" title="Collapse sidebar">&#171;</button>
      <div class="sidebar-sub">ST Admin</div>
    </div>
    <div class="sidebar-nav">
      <button class="sidebar-btn" data-domain="players">Players</button>
      <button class="sidebar-btn on" data-domain="player">Characters</button>
      <button class="sidebar-btn" data-domain="city">City</button>
      <button class="sidebar-btn" data-domain="spheres">Spheres</button>
      <button class="sidebar-btn" data-domain="downtime">Downtime</button>
      <button class="sidebar-btn" data-domain="cycle">Cycle</button>
      <button class="sidebar-btn" data-domain="ordeals">Ordeals</button>
      <button class="sidebar-btn" data-domain="attendance">Attendance</button>
      <button class="sidebar-btn" data-domain="data">Data</button>
      <button class="sidebar-btn" data-domain="documents">Documents</button>
      <button class="sidebar-btn" data-domain="tickets">Tickets</button>
      <button class="sidebar-btn" data-domain="rules">Rule Data</button>
      <button class="sidebar-btn" data-domain="rde">Rules Engine</button>
      <button class="sidebar-btn" data-domain="equipment-catalogue">Equipment Catalogue</button>
      <button class="sidebar-btn" data-domain="st-mods">ST Mods</button>
      <button class="sidebar-btn" data-domain="st-mods-audit">ST Mods Audit</button>
      <button class="sidebar-btn" data-domain="devlog">Devlog</button>
    </div>
    <div class="sidebar-footer-nav" id="sidebar-footer-nav"></div>
    <div class="sidebar-user" id="sidebar-user"></div>
  </nav>

  <!-- Content area -->
  <main id="content">

    <!-- Players domain -->
    <section id="d-players" class="domain">
      <div class="domain-header">
        <h2>Players</h2>
        <span id="players-count" class="domain-count"></span>
      </div>
      <div id="players-content"></div>
    </section>

    <!-- Player domain -->
    <section id="d-player" class="domain active">
      <div class="domain-header">
        <h2>Characters</h2>
        <span id="char-count" class="domain-count"></span>
        <button id="btn-new-char" class="btn-sm" onclick="window.createNewCharacter()">+ New Character</button>
        <button id="btn-csv" class="btn-sm" onclick="window.downloadCSV()">Download CSV</button>
      </div>
      <div id="char-grid" class="char-grid"></div>
      <div id="char-detail" class="char-detail" style="display:none"></div>
    </section>

    <!-- City domain -->
    <section id="d-city" class="domain">
      <div class="domain-header"><h2>City</h2></div>
      <div id="city-content"></div>
    </section>

    <!-- Spheres domain -->
    <section id="d-spheres" class="domain">
      <div class="domain-header"><h2>Spheres</h2></div>
      <div id="spheres-content"></div>
    </section>

    <!-- Downtime domain -->
    <section id="d-downtime" class="domain">
      <div class="domain-header">
        <h2>Downtime</h2>
        <!-- DTUX-1: sub-tab strip removed; #dt-phase-ribbon below is the
             single nav surface (clickable tabs with sign-off badges). -->
      </div>
      <div id="dt-ctrl-bar">
        <div class="dt-toolbar">
          <button class="dt-btn dt-btn-new" id="dt-new-cycle">+ New Cycle</button>
          <button class="dt-btn" id="dt-close-cycle" style="display:none">Close Cycle</button>
          <button class="dt-btn dt-btn-export" id="dt-export-all" style="display:none">Export MD</button>
          <button class="dt-btn dt-btn-export" id="dt-export-json" style="display:none">Export JSON</button>
          <button class="dt-btn dt-btn-export" id="dt-import-csv">Import CSV</button>
          <input type="file" id="dt-import-csv-input" accept=".csv" style="display:none">
        </div>
        <div id="dt-cycle-bar" class="dt-cycle-bar">
          <select id="dt-cycle-sel" class="dt-cycle-sel"></select>
          <span id="dt-cycle-status" class="dt-cycle-status"></span>
        </div>
      </div>
      <div id="dt-phase-ribbon" style="display:none"></div>
      <!-- DTUX-1: #dt-sub-ribbon retired (kept hidden via JS for deferred markup cleanup) -->
      <div id="dt-sub-ribbon" style="display:none"></div>
      <div id="dt-prep-panel" class="dt-prep-panel" style="display:none"></div>
      <div id="dt-processing-panel" class="dt-panel" style="display:none">
        <div id="downtime-content"></div>
      </div>
      <div id="dt-city-panel" class="dt-panel" style="display:none"></div>
      <div id="dt-story-panel" class="dt-panel" style="display:none"></div>
      <!-- DTUX-1: DT Ready phase — Push Cycle action area -->
      <div id="dt-ready-panel" class="dt-panel" style="display:none"></div>
    </section>

    <!-- Cycle domain (#708) -->
    <section id="d-cycle" class="domain">
      <div class="domain-header"><h2>Cycle</h2></div>
      <div id="cycle-content"></div>
    </section>

    <!-- NPC Register domain (NPCR.1) — hidden from sidebar; data preserved in MongoDB
    <section id="d-npcs" class="domain">
      <div class="domain-header">
        <h2>NPC Register</h2>
        <span id="npcs-count" class="domain-count"></span>
      </div>
      <div id="npcs-content"></div>
    </section>
    -->

    <!-- Ordeals domain -->
    <section id="d-ordeals" class="domain">
      <div class="domain-header"><h2>Ordeals</h2></div>
      <div id="ordeals-content"></div>
    </section>

    <!-- Attendance domain -->
    <section id="d-attendance" class="domain">
      <div class="domain-header"><h2>Attendance &amp; Finance</h2></div>
      <div id="next-session-content"></div>
      <div id="attendance-content"></div>
    </section>

    <!-- Data domain -->
    <section id="d-data" class="domain">
      <div class="domain-header"><h2>Data Portability</h2></div>
      <div id="data-portability-content"></div>
    </section>

    <section id="d-documents" class="domain">
      <div class="domain-header"><h2>Documents</h2></div>
      <div id="documents-content"></div>
    </section>

    <section id="d-tickets" class="domain">
      <div class="domain-header"><h2>Tickets</h2></div>
      <div id="tickets-admin-content"></div>
    </section>

    <section id="d-rules" class="domain">
      <div class="domain-header">
        <h2>Rule Data</h2>
        <span id="rules-count" class="domain-count"></span>
      </div>
      <div id="rules-content"></div>
    </section>

    <section id="d-rde" class="domain">
      <div class="domain-header"><h2>Rules Engine</h2></div>
      <div id="rde-content"></div>
    </section>

    <section id="d-equipment-catalogue" class="domain">
      <div class="domain-header"><h2>Equipment Catalogue</h2></div>
      <div id="equipment-catalogue-content"></div>
    </section>

    <section id="d-st-mods" class="domain">
      <div id="st-mods-panel-content"></div>
    </section>

    <section id="d-st-mods-audit" class="domain">
      <div id="st-mods-audit-content"></div>
    </section>

    <section id="d-devlog" class="domain">
      <div class="domain-header"><h2>Devlog</h2></div>
      <div id="devlog-admin-content"></div>
    </section>

  </main>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
