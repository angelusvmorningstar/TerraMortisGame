nce on non-clickable rows; missing AC1 negative-filter test; transposed DB/wiring test-count documentation; a false CSS-usage claim in the Dev Agent Record). All patches prove-discriminated. Changed-area regression 104/104 across 6 files; full suite 2426/2431 (5 failed/10 files, byte-identical to established baseline, no new failures). No unresolved High/Medium remains. POST-SCRIPT (2026-08-12, same day): moved from the ST admin app to the main game app as an ST-only tab per Angelus ("put it on the main player app as a tab that only appears to STs") - public/js/admin/office-approvals.js -> public/js/suite/office-approvals.js, registered in app.js's MORE_APPS/NAV_ITEMS (stOnly, same pattern as Territory/Tracker/Combat/Spheres), removed entirely from admin.html/admin.js. The .dt-btn-gold/.dt-btn-danger note above is now STALE - since the module lives in the game app now, it uses .ch-btn-accept/.ch-btn-decline (challenge-notification.js's existing styling, index.html DOES load suite.css) instead, a better fit than either option this story originally weighed. See PR #1148. Story: oaq-3-st-tab-approval-queue-view.md

