s codebase to need it). Explicitly NOT in scope: seat CRUD, oxp-9 spend-approval routing, oxp-7's sheet section, Administrator content, any change to who can purchase or see purchase state, a seat picker (oxp-6's own prior scoping note flagged wanting one, but this story only touches purchase markers, not seat resolution). Dev-story should confirm the AC7 open question with Angelus before or during implementation. HARD REQUIREMENT HANDED FORWARD BY oxp-5 (2026-08-13), do not rediscover this the hard way: officeXpSpentForCategory in public/js/data/office-xp.js MUST add office_manoeuvre_ranks.manoeuvre_xp_destroyed to its spend total BEFORE any balance is rendered anywhere. Office spend is DERIVED from current state (current merit dots + current manoeuvre rank), so oxp-5's handover reset drops the derived spend by the destroyed rank and RAISES the balance by exactly the amount content/rules/office-powers.md says is gone - a refund, which the ruling forbids explicitly ("the running balance is total accrued since creation, minus everything ever spent, INCLUDING THE SPEND THAT HAS SINCE BEEN LOST"). oxp-5 stores the cumulative counter and deliberately does not consume it, because office-xp.js has no consumer yet so nothing is wrong on screen today, and wiring it there would have rewritten oxp-2's AC8 from inside oxp-5. The counter cannot be recomputed from anything at any later time by any means - it is destroyed by definition and exists nowhere else - so if a balance ships without it, the number is simply wrong and there is no way to detect it after the fact. LIMITATION INHERITED FROM oxp-11 (2026-08-13): an ST or dev browsing a MULTI-SEAT office they do not hold (Primogen, Socialite) sees ONE of its seats' purchase state, chosen by a deterministic fallback (ascending created_at then _id), and can edit it with the stepper. oxp-11 ships an on-screen note naming which seat is on screen, which makes that survivable rather than dangerous, but it is a label and not a picker 