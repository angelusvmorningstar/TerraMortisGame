  oxp-5-handover-logic: done                                  # CODE REVIEW COMPLETE, STORY DONE 2026-08-14 (external Codex review via the codex-review skill; full outcome at the end of this entry and in oxp-5-handover-logic.md's Senior Developer Review section). STILL NOT COMMITTED, NOT pushed, NOT merged - Angelus's call. DEV COMPLETE 2026-08-13, awaiting code review, NOT committed at that point. Delivered: new transactional PUT /api/office_seats/:seatId/holder on the already-mounted office-seats router (no server/index.js or test-app.js change), requireRole('st') on the write while GET / stays open - the same split office-merit-dots.js uses. Transaction scaffolding copied from office-actions.js's PUT /:id/accept: getClient() + startSession() + withTransaction, a locally-defined RouteResponse extends Error so a business rejection aborts cleanly without the driver's transient-error retry, status/body captured outside the callback, response sent after commit, endSession in a finally. Write order inside the callback is read seat, read target, AC2 conflict check, CAS-claim the seat FIRST, clear the departing holder (matchedCount 0 is benign and reported, never an abort), set the incoming holder, reset the manoeuvre rank LAST. holder_id is stored as a real ObjectId, pinned by test. ONE DESIGN DEVIATION FROM THE STORY TEXT, made deliberately and worth a reviewer's attention: AC3 puts the seat read inside the transaction, and the compare-and-swap baseline is instead captured by an ADDITIONAL read taken BEFORE the transaction opens (the seat is still re-read inside it, for the 404-on-delete and the authoritative category). Reason, found empirically rather than reasoned about in the abstract: session.withTransaction RE-RUNS its callback on any error MongoDB labels transient, and a genuine concurrent write to the same document is exactly that (WriteConflict). With the CAS filtering on a holder read INSIDE the callback, the retry re-reads, sees the winner's freshly committed holder, filters on THAT, and succeeds - so two simultaneous handovers would both return 200 and the ladder would be reset twice. The outer read freezes the baseline across retries so the loser's filter names the pre-race holder, matches nothing, and 409s. This mirrors office-actions.js's own _findPending, which likewise reads its record outside the transaction and uses that outer value in the CAS inside it. A SECOND, SMALLER DEVIATION: AC6 specifies updateOne; the implementation uses findOneAndUpdate with returnDocument 'before'. It is the identical single atomic aggregation-pipeline update (the same idiom office-manoeuvre-rank.js's step route uses) and additionally returns the pre-image, which is the only way to satisfy AC1's response requirement (rank before the reset, new cumulative destroyed total) without adding a second read. TESTING NOTE THE STORY GOT WRONG, corrected by measurement: AC10's mandated "two simultaneous handovers produce exactly one 200 and one 409" is NOT a reliable assertion, because two requests fired through Promise.all do not reliably interleave - measured at roughly 4 times in 5 on this machine, and in the fifth the second request's pre-read lands after the first has committed, making it two SEQUENTIAL handovers for which two 200s is the correct answer, not a bug. Asserting a bare "exactly one 200" would have been asserting the scheduler, i.e. a flaky test. Replaced with a 10-iteration loop (issue-1143's own convention, and the same reason oxp-3's review had to widen its race from two callers to four) asserting the invariants that hold either way: every response is a 200 or a clean 409 and never a crash; two winners are only ever legitimate sequential handovers, provable because they report DIFFERENT previous_holder_id values (two winners reporting the SAME prior holder is the real bug and never occurs); the sitting holder's 3-XP ladder is destroyed EXACTLY once, counter landing on 3 and never 6, which is "the loser destroyed no XP" in its non-flaky form; exactly one rival ends up holding the seat with a matching court_category and the other holds nothing; and at least one iteration must actually produce a 409, so the guard is proved to fire rather than never being reached. CLIENT: admin/city-views.js's court panel is now seat-backed - seats fetched once in initCityView beside terrDocs (renderCity/renderCourt stay synchronous), one row per real seat carrying data-seat-id, ordered ascending created_at then _id to match office-tab.js's _fallbackSeat exactly, seat_label or a short id shown when a category has more than one seat, an explicit no-seat line for a category with none, and saveCourt making ONE handover call per changed row with NO /api/characters/ call anywhere in that path. The Add-slot and remove-slot buttons and their handlers are removed entirely (see the story: they created a holder with no seat behind them). apiPut was confirmed to surface the server's own message body, so a 409 arrives naming the conflicting seat; two supporting changes were needed to make it legible - the panel's open/closed state is now remembered across a re-render (court-save-status lives INSIDE the panel, which renderCourt otherwise re-renders collapsed, so the message would have been written into a hidden element) and the save now re-renders BEFORE writing the status text, #634's ordering, which also fixes a pre-existing bug where the old "Saved" message was wiped in the same tick. TESTS: new server/tests/oxp-5-handover-logic.test.js, 46 tests (seat fixture decade 51-56, escaped fixture-prefix regex at module scope), 46/46. FULL TARGETED GATE, all seven files in one invocation: 204/204, 0 failed, run THREE consecutive times identically, with a verbose pass counting 204 individually-ticked tests so nothing was skipped rather than passing. TWO BUGS FOUND IN VERIFICATION AFTER THE FIRST DEV PASS REPORTED GREEN, both written up in full in the story's Dev Agent Record. Bug 1, real and fixed: this suite's beforeEach/afterAll ran UNFILTERED deleteMany({}) on office_merit_dots and office_manoeuvre_ranks. The story text spells the hazard out for office_seats and that was followed, but the identical reasoning applies to the two purchase collections (same seat keys, same five sharing suites) and was missed; all four deletes are now one removeFixtures() helper scoped to this suite's own seat ids, and the one no-document-minted assertion that counted with a bare {} filter moved to the same scope. Bug 2, NOT a bug in this story: verification saw 24 failed/180 passed across 4 of 7 files, non-deterministic failure counts (12/8/10) across three supposedly-isolated runs, an E11000 duplicate-key on seat 51 thrown from this suite's own beforeEach insert, and intermittent failures in PURE STATIC source-contract tests that touch no database. That last symptom is the thread: beforeEach is registered at FILE level, so when it throws vitest fails every test in the file including the static ones, meaning there was one fault and not many. Root cause, PROVED not assumed: two vitest processes were running against the same tm_suite_test database at once (the dev run and the verification run). setup-env.js redirects only the database NAME, tm_suite_test is a single shared database on the same Atlas replica set as production with no per-run namespacing, and nothing detects a second concurrent run. Proof in three steps - beforeEach temporarily instrumented to report seat count before cleanup, deletedCount, and count immediately after; run alone three consecutive times 46/46 with the diagnostic never firing, and the seven-file gate alone 204/204 likewise; then two full gates deliberately launched concurrently, reproducing the original signature immediately (68 failed/136 passed in one process, 67/137 in the other) with diagnostics impossible from a single process - DIAG pre=6 deleted=0 mid=6 (this run's deleteMany removed nothing because the other run had already deleted the seats, yet a count taken immediately after found all six back) and DIAG INSERT FAIL pre=6 deleted=6 mid=0 present=[all six] (all six deleted, verified absent, all six present again microseconds later at the insert). So: no async leak, no unjoined Promise.all, no transaction outliving its response, and nothing wrong with the route - endSession and the commit are genuinely settled before each HTTP response resolves, and the AC3 concurrency test was not the culprit and needed no change. The harness limitation is real, pre-existing and unguarded, sits alongside the isDbAvailable connectivity-not-transaction-support caveat, and matters in this workspace specifically because it is shared between concurrent sessions: only ONE vitest process may run against tm_suite_test at a time, and what a second one produces looks exactly like a subtle application bug. Fixing the harness (per-run database namespacing, or a lock) was deliberately not attempted here. oxp-2's "exposes no write verb" test restated and STRENGTHENED per AC10 (collection root still refuses all four verbs; a bare seat id is not addressable either; the /holder sub-route answers to PUT alone) rather than left to rot, and oxp-4's repointSeat comment corrected while the helper deliberately keeps writing the seat directly so its merits-survive proof stays independent of this route rather than circular. All three mandated prove-discrimination checks run as single changes, one at a time, each reverted and re-confirmed green: inverting AC6's two pipeline stages failed exactly the 5 destroyed-counter tests; removing AC2's conflict check failed exactly the 3 refusal tests; disabling the AC4 same-holder branch failed exactly the 5 no-op tests. Nothing unrelated moved in any of the three. FLAGGED FOR ANGELUS, a decision he may want to turn into a story: removing the Add-slot control leaves IN-APP SEAT CREATION AND DELETION as a real gap with no story home - seats are still minted only by oxp-1's manual seed script, which has still never been run for real. Live tm_suite was never connected to or written to. Pre-existing and untouched: oxp-1-office-seats.test.js still does not load at all under vitest (the shebang in seed-office-seats.mjs), so its 41 tests remain silently unrun. ORIGINAL STORY-CREATION NOTE FOLLOWS. STORY CREATED 2026-08-13. Implements office-powers.md's handover ruling: on a change of officeholder, permanent merits stay with the office and manoeuvres reset to zero with their spent XP destroyed (not refunded, not banked). Nothing in this codebase implements the reset, and nothing records a handover at all - characters.court_category (which actually gates behaviour: office-actions.js's auth check, office-tab.js's isOwnOffice, city-tab.js, admin/city-views.js) and office_seats.holder_id (which oxp-2 and oxp-11 depend on to resolve WHICH seat's purchase state to show) are two independent facts that agree today purely by accident. HARD REQUIREMENT INHERITED FROM oxp-11, now satisfied by AC3: oxp-5 MUST write office_seats.holder_id when a seat changes hands, or the new holder stops resolving to their own seat by holder match and a multi-seat office (Primogen, Socialite) can resolve to the WRONG seat. Also UNBLOCKED by oxp-11: both purchase collections are seat-keyed, so resetting one seat's manoeuvre rank no longer destroys the other seat's unrelated progress in the same office. ANGELUS'S TWO SCOPING RULINGS, asked directly before ACs were written (2026-08-13): (1) do NOT derive court_category from holder_id - that is a large, risky refactor touching every read site; instead build ONE transactional route that keeps the two in sync atomically and leaves every existing read site untouched, which is the smaller option and the reason this is one story; (2) DO rewire admin/city-views.js's existing court-slots panel to call it, since leaving that panel as a raw-edit path would let an ST bypass the entire story through the familiar control. THREE FINDINGS FROM THIS STORY'S OWN INVESTIGATION, none of them in the original scoping, each confirmed against the real code. FINDING 1, the most important: the reset implemented the obvious way would REFUND the destroyed XP rather than destroying it. Office spend is DERIVED, never stored - oxp-2's officeXpSpentForCategory sums current merit dots plus the current manoeuvre rank - so zeroing rank makes derived spend DROP and the balance RISE by exactly the amount the ruling says must be gone. office-powers.md anticipated this ("the running balance is total accrued since creation, minus everything ever spent, INCLUDING THE SPEND THAT HAS SINCE BEEN LOST") and it cannot be recomputed after the fact by any means, so AC6 captures a cumulative manoeuvre_xp_destroyed counter on the seat's office_manoeuvre_ranks document in the same atomic aggregation-pipeline update that zeroes the rank (stage order is load-bearing: stage 1 must read the original $rank before stage 2 sets it to 0). The ARITHMETIC is deliberately handed forward rather than wired here, exactly as oxp-11 handed holder_id to this story: office-xp.js has no consumer yet so nothing is wrong on screen today, and changing its functions would rewrite oxp-2's AC8 from inside this story - but whoever builds oxp-6/oxp-7 MUST add manoeuvre_xp_destroyed to officeXpSpentForCategory before rendering any balance, or it over-reports by the destroyed amount. FINDING 2: resolveOfficeSeat() in server/lib/office-seat-resolve.js CANNOT be reused, for two independent reasons - it 400s any seat whose office has no OFFICE_DATA entry, which is Administrator until oxp-8, and the Administrator seat is real, filled (Ivana Horvat, since Game 5) and must be handoverable; and it takes no session parameter so it would read outside the transaction. Only its exported SEAT_ID_PATTERN is reused, and a test pins that an Administrator handover succeeds so the refusal cannot creep back in via a later tidy-up. FINDING 3: court_title lives on the CHARACTER and seat_label on the SEAT, and they are not equivalents - seat_label is the seat's permanent distinguisher ("Harpy" appointed vs "People's Harpy" popular) and is the only thing telling Socialite's two seats apart, so the route writes court_title and must NEVER write seat_label (AC8 pins it). SCOPE: new PUT /api/office_seats/:seatId/holder on the existing (already-mounted, so no index.js or test-app.js change) office-seats router, requireRole('st'), body {holder_id: 24-hex or null, court_title optional}, wrapped in getClient()+session.withTransaction() copying office-actions.js's PUT /:id/accept pattern exactly - RouteResponse extends Error for clean business rejections that do not trigger the driver's transient-error retry, claim-the-seat-FIRST with a compare-and-swap on its current holder_id (matchedCount 0 gives 409), status/body captured outside the callback and sent after commit. Write sequence: read seat, read target, refuse-on-conflicting-seat, CAS-claim the seat, clear the departing holder (CAS-filtered on this office's category; matchedCount 0 is BENIGN, meaning they had already moved on, not an error), set the incoming holder, then reset the manoeuvre rank last. holder_id is stored as a real ObjectId, never a string (live storage is BSON ObjectIds; a string would create data-map.md Known Drift Pattern #2). AC2 REFUSE-ON-CONFLICT: a target already holding a DIFFERENT seat is a 409 naming the conflicting seat and requiring an explicit vacate first, never a silent cascade - court_category is a single field, so assigning someone into a second seat would either leave the first seat's holder_id stale (oxp-11's bug relocated, not solved) or make this route silently modify a third document the caller never named; same refuse-rather-than-guess posture as oxp-1's seed script and oxp-11's migration. A character with a court_category but NO seat behind them is explicitly NOT a conflict - the seat is authoritative and the stale value is overwritten. AC4: same-holder (including null-to-null re-vacate) is a safe idempotent 200 no-op with handover false, no reset and no XP destroyed, because the court panel saves every slot and re-saving must never be able to wipe a ladder; a changed court_title is still applied. AC5: vacating (holder_id null) IS a handover and destroys the departing holder's manoeuvre investment exactly as a replacement would - the ruling's own consequence 2 (a holder near the end of their tenure has no reason to buy manoeuvres) depends on it. AC6 reset uses upsert false deliberately, so a seat that never purchased a rank is a correct silent no-op rather than minting a meaningless rank-0 document, and sets rank to 0 rather than deleting the document so updated_at and the destroyed counter survive as evidence a reset happened. AC7: office_merit_dots is untouched and PROVED so (byte-identical including updated_at, in the same test that proves the rank DID reset) - this matters more than it did for oxp-4, whose guarantee was safe only because nothing COULD reset anything; this story builds the thing that can. CLIENT (AC9): admin/city-views.js's court panel becomes SEAT-BACKED. Investigation found its slot rows have NO seat identity at all - a row is keyed only by category and DOM order, and saveCourt does a clear-pass then an assign-pass of independent PUT /api/characters/:id calls - so this is a rework, not a redirect of two URLs. Seats are fetched once in initCityView beside terrDocs (renderCity/renderCourt stay synchronous), one row per seat carrying data-seat-id, ordered ascending created_at then _id to MATCH oxp-11's _fallbackSeat so the admin panel and the office tab never disagree about which seat is first, with seat_label or a short id shown so Primogen's two identically-titled seats are distinguishable, and an explicit no-seat line for a category with no seat. saveCourt then makes ONE handover call per changed row and NO /api/characters/ call at all - the new route's single call replaces both halves of a reassignment. The Add-slot and remove-slot buttons are REMOVED rather than rewired: they currently create a holding by writing court_category to an extra character, producing a holder with no seat behind them, invisible to oxp-2's XP derivation and oxp-11's purchase resolution - i.e. exactly the inconsistent data this story exists to stop. THAT LEAVES IN-APP SEAT CREATION/DELETION AS A REAL GAP WITH NO STORY HOME - seats are still created only by oxp-1's manual seed script. Adding a story for it was not in this story's brief; it is Angelus's call. AC10: oxp-2-derived-office-xp-calculation.test.js's "exposes no write verb - this story adds a GET and nothing else" test will still PASS mechanically (the new route is at /:seatId/holder, so a bare PUT /api/office_seats still 404s) while its title and comment become false, so it is restated and STRENGTHENED (collection root has no write verb; the seat-scoped route accepts only PUT) rather than left to rot; oxp-4's repointSeat helper comment is corrected too, but the helper deliberately keeps writing the seat directly so its merits-survive proof stays independent of this story's route rather than circular. TESTING: transactions genuinely work here - this repo never runs against a standalone mongod (db.js hard-codes tls true against an Atlas mongodb+srv cluster and setup-env.js redirects only the DATABASE NAME to tm_suite_test, so it is the same replica set as production), there is no memory-server and no replica-set detection anywhere, and the existing transactional-route suites (oaq-2, otc-2) do not gate on it at all. isDbAvailable() is a CONNECTIVITY skip only. Concurrency proved by the established Promise.all race convention (oaq-2 AC8, issue-1143): two simultaneous handovers on one seat, exactly one 200 and one 409, loser destroys no XP. Seat fixtures use the namespaced deterministic-ObjectId decade convention (oxp-3 took 31-34, oxp-4 took 41-43; this suite claims 51+) and must NEVER deleteMany({}) office_seats, which three other suites share. NOT IN SCOPE: no backfill of the 7 live