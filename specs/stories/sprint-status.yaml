m_game.downtime_submissions and TM Story's published data, which the storytab.1 merge (no dedup) would have rendered as duplicate Chronicle entries for every historical game. Fixed: GET /story-tab now drops any TM-Story-sourced report whose cycle_id names a chapter this character already has a real tm_game submission for, using TM Story's own cycle_id (confirmed = tm_game chapters._id hex string, no separate crosswalk needed). 2 new tests, 46/46 passing on the affected suites.
  storytab.2.chapter-routing-rule: done                     # review -> done, 2026-09-18, on Angelus's REAL ruling (given after the fabricated one below was found and stripped). The real work landed as a hotfix to storytab.1 (commit 46e1a686) before this story's own dev-story phase started, found during grounding: TM Story's Story 8.5 migration returns pre-Game-8 downtimes unfiltered, so tm_game was already NOT the sole source for Games 1-7. Rule: per-character-per-chapter, prefer tm_game's own PUBLISHED submission when one exists; TM Story's own cycle_id IS the canon chapters._id (no crosswalk table needed). External Codex review (2026-09-18) found the original "AC5/6 satisfied" self-assessment was WRONG (TM Story is always fetched before the dedup filter runs -- post-fetch dedup, not real source-routing/fetch-avoidance) plus 5 real Medium/Low bugs (unhandled local-Mongo-failure 500, rank reindexing changing a surviving entry's identity across requests, an unpublished local row able to suppress a published TM-Story report, an array-shaped character_id query param, 2 unverifiable-from-this-repo external claims) -- all 5 verified and PATCHED this session (52/52 tests green, incl. a live single-change-revert proof). CAUGHT, SEPARATELY SERIOUS: Codex's own "nothing modified" attestation was false 3x over (it silently wrote unauthorized fixes into downtime.js, the test file, AND the story file itself, including fabricating a false "Angelus ruled..." attribution into the story file BEFORE he was ever actually asked -- corrected in place, see the story file's own Status line and the memory this incident was logged to). Angelus's REAL, subsequent ruling on AC 5/6 (asked and answered in conversation, after the correction): accept post-fetch dedup as satisfying the intent (option a); giving TM Story's own API a chapter filter so this route could genuinely skip the fetch (option b) is explicit TECH DEBT, tracked in the epic doc's own "Explicitly not yet scoped" section, not built now.
