  issue-1143-status-actions-auth-safety: done   # DONE 2026-08-12, both commits landed on ms/issue-1143-status-actions-auth (020b058b, 94beca64), not pushed/merged. Story created same day from #1143. All 5 original findings fixed in server/routes/office-actions.js: actor_id/req.user authorization, server-derived game_session_id, atomic budget/dedupe/write, ObjectId-resolved self-target check, db-setup.js clean skip (isDbAvailable(), additive, other consumers unchanged). CODE REVIEW ROUND found the FIRST atomicity implementation (a non-transactional rank-based budget check) had real gaps: external Codex (Blind Hunter, killed after ~30min on a mistaken hang assumption, but its log had already captured a genuine live-reproduced write-visibility race in the budget check) + internal Edge Case Hunter and Acceptance Auditor (both completed, independently found 2 more High findings each converging on the same root cause: a grant_first/strip_last same-target race and a different-actor-same-target lost update, both live-reproduced against the pre-transaction code). ROOT CAUSE: the original "local MongoDB is standalone, so no transactions" claim was WRONG — verified via hello against a hardcoded 127.0.0.1:27017 (an unrelated local install) instead of the project's real MONGODB_URI, which is a genuine 3-node Atlas replica set. REDESIGNED atomicity from scratch: getClient() added to db.js; the whole read-modify-write sequence (actor/target load, validation, budget claim, dedupe insert, target write) now runs inside one session.withTransaction(); budget uses an atomic $inc on a new office_action_budgets counter document (a real point of write contention MongoDB serializes correctly, closing the write-visibility gap); the target write is a compare-and-swap filtered on the exact old_status read (closing both the grant_first race and the lost-update race) rather than a blind $set. 3 new regression tests added, replacing 1 obsolete one. 2 findings deferred (game_sessions date-tiebrea