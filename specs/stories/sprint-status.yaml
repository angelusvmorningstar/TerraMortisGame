  bl-3b-delete-constants-and-seed: done             # REVIEWED AND PATCHED 2026-08-11, review -> done. External adversarial review (Codex): 1 High, 4 Medium, 4 Low, ZERO functional defects in the shipped code. 5 fixes (4 Med, 1 Low), 3 Low dismissed, 1 High left open because no code change addresses it. (1) The comment stripper behind every AC 1/2/5/6 source grep was a regex pair that cannot lex strings - measured erasing real executable text in 10 of 659 files under public/js and server, worst case 2313 chars in admin/bloodlines-admin.js which is INSIDE the AC 2 walk. Replaced with a quote-aware scanner, server/tests/helpers/strip-comments.js, self-tested 7 ways; bl3a's identical code() repointed at the same helper because it is the co-guard running the empty allow-list. Three further copies of the old pair remain in bl2-boot-priming and the two bl4 suites - left alone, none of them walks a tree, named in the review so the next author repoints rather than rediscovers. (2) The index-ordering test proved no ordering; it now asserts source positions (after router.post('/'), before the first insertOne, before the next handler) and names bl4-write-api:275-294 as the behavioural guarantee. (3) The no-live-importer guard missed FOUR of five import forms once an offender was planted - double-quoted from, dynamic import(), bare import "..." AND bare single-quoted import '...' which is what this repo's own convention produces. The first cut of the fix still missed the bare forms; only the probe caught it. (4) THE SUBSTANTIVE ONE: bl1-seed-bloodlines.test.js retired with 35 tests and only 5 relocated, leaving checkIntegrity/buildSeedDocs/crossCheckHolders untested in a script AC 5 deliberately keeps RUNNABLE against a never-seeded production collection. New bl3b-archived-seed-smoke.test.js, 22 tests, NO database (db.js connects only inside connectDb, and assertTestDbSafety refuses a non-_test DB under vitest): eleven integrity-gate defect classes, buildSeedDocs refusing a rejected source rather than dropping the bad row, and the archived script rebuilding the migrated 23 document for document against the frozen fixtures - which converts Codex's one-off hand comparison into a permanent test. It is the single documented exemption to the no-importer guard, and that guard asserts the exemption is real. (5) Both frozen fixture copies gained created_at/updated_at at a frozen FIXTURE_TIMESTAMP; PUBLIC_PROJECTION strips only notes, so the timestamps are genuinely served, and the same constant is what the smoke suite hands buildSeedDocs. ACCEPTED AS-IS: bloodline-slug.js:4's stale path cite (out of scope by name), and the two extra full-suite reds Codex reproduced and confirmed this change does not touch. All five fixes proved to discriminate by single-change revert, each restored byte-identically. 308 tests green across 16 suites, up from 278/15; 30 new tests. AC 9 STILL OPEN AND STILL BLOCKS MERGE: production holds ZERO bloodline documents; merging before the seed is applied puts all 13 bloodline-carrying characters on BL-2's loud-miss path at once. Operational, not code, and Angelus's sequence - seed production first, THEN merge. done = implemented and reviewed, NOT ready to deploy. Nothing committed, nothing pushed. # STORY WRITTEN 2026-08-11 (bl-3b-delete-constants-and-seed.story.md, 9 ACs). Bigger than it reads: production holds ZERO bloodline documents, so the archived seed must stay RUNNABLE - the constants are inlined into scripts/archive/seed-bloodlines.js as frozen literals and its five relative imports repathed, or the only bulk migration path into a fresh collection dies with them. FOUR test files import the constants or the seed: bl1-seed retires (deriveSlug block relocated first, it tests the live server/lib/bloodline-slug.js), bl2-clandisclist and bl3a repoint to a new server/tests/helpers/bloodline-fixtures.js, bl4-write-api:613-617s deriveSlug-identity assertion is replaced. dev-fixtures.js gets a frozen single-line JSON blob like its five siblings (ECM/PP have no fixture branch at all, so the blob IS the precedent), guarded by a test that parses it back out and deep-equals the helper. wizard.js:11/118 FIXED not deferred - dead, but a dangling import of a deleted export breaks #1095s revival, and fixing it empties the BL-3a allow-list, discharging the AC1-vs-AC7 contradiction. Index guarantee needs NO code change: routes/bloodlines.js:183-192 already ensures it before the first write and bl4-write-api:275-294 already discriminates; only a guard that bloodline-name-index.js keeps a live importer outside scripts/archive. After-Game-7 gate does NOT bind - zero live behaviour change; the gate is on the MERGE and the seed run. No data-lock needed. # AFTER BL-4. Delete BLOODLINE_DISCS/BLOODLINE_CLANS/APPROVED_BLOODLINES, retire seed-bloodlines.js to scripts/archive (it is a one-time migration once the collection is canonical), and rewire dev-fixtures.js:1 which currently derives its fixture list from the constants. Blocked until something other than the seed can write the collection.
  bl-4-admin-crud: done                                    # DONE 2026-08-11: implemented, then external adversarial review (Codex) verified and patched - 12 fixes, 0 dismissed. Three read-then-write races the record wrongly claimed were closed: case-different creates (now a strength-2 collation on bloodline_name_unique, in shared server/lib/bloodline-name-index.js, ensured from the route); the delete guard (now check/delete/re-check/restore - a transaction would not have helped, MongoDB has no predicate locking); and out-of-order /impact responses saving one bloodline over another. Plus a guarded ws fan-out (all four broadcasters), a generation counter in bloodlines-cache closing both the admin-boot ordering race and overlapping refetches, and grant_rule_count on GET /api/bloodlines/admin so AC 12s Delete-disable finally sees grant-only references. AC 15 re-run for real including the character assignment the first pass skipped. 342 green across 18 suites. Notes below are the ORIGINAL build notes; (b) is superseded - refetchBloodlines still does not share _inFlight, but the reason given (both apps await priming) was false and the guarantee now lives in the generation counter. # IMPLEMENTED 2026-08-11. Everything specced below shipped; the two design calls held. Notes from the build worth carrying into review: (a) the delete guard and the collision check both read their collections whole and filter in memory rather than using a case-insensitive regex, so they use literally the same normKey the cache resolves costing through - the sets are 13 characters and 3 grant rules, so the cost is nil; (b) refetchBloodlines deliberately does NOT share loadBloodlines' _inFlight promise, so a boot load failing after a successful refetch cannot wipe what the refetch repaired; (c) the ECM CSS block was retitled as shared reference-data chrome and reused directly - only .bl-disc-cell/.bl-disc-grid are new and the discipline chip is grouped onto the existing tag selector; (d) issue-836-legacy-tracker-cache-removed.test.js is a SEVENTH pre-existing red not on the known list - it reads public/js/suite/tracker.js, deleted from HEAD by 58c88b5b. # STORY WRITTEN 2026-08-11 (bl-4-admin-crud.story.md, 15 ACs). Two design calls made in the story, both recorded with reasoning: (1) RENAME IS BLOCKED - `name` and `slug` are excluded from the PATCH allowlist (ECM's immutable-`bucket` precedent); three things key off the name as a plain string with no FK (characters.bloodline, rule_grant.bloodline_name, and the cache's own _byName index), so a rename orphans every holder at once and a cascade would perform the exact name->different-name transition BL-5 forbids. clan/disciplines/notes ARE editable, with an impact banner. (2) DELETE IS IMPLEMENTED, hard-guarded - 409 when any character holds the name (matched on the cache's trim+case-fold key, not exact) or any rule_grant references it; framed as "remove a mistake", not "retire a bloodline". Without it, immutable-name + create-only would make a single typo permanent and visible in every dropdown forever. Also specced: ST-gated GET /api/bloodlines/admin (notes are unreachable today), merged-document validation on PATCH so the 4-discipline rule survives a partial update, deriveSlug moved out of the seed ahead of BL-3b's archive move, a WS bloodline frame wired in BOTH apps, and a refetch that must NOT wipe the cache on failure (the naive ECM copy would hard-lock every bloodline character on one network blip). DATA-LOCK RECOMMENDED first: epic's first write surface; BL-2's lock verified reads only. # ST admin CRUD. This is where #1008's actual promise lands ("add a bloodline without a deploy"). Note: the 4-discipline constraint means no partial-save - a 3-disc bloodline is invalid, not a draft. RULED 2026-08-10 (BL-1 review): `notes` is ST bookkeeping, NOT player-facing - BL-1's public reads project it out, so BL-4 must add an ST-GATED read to surface it in the admin UI. Player-visible flavour text, if ever wanted, is a separate `description` field as ECM has.
  bl-5-character-bloodline-validation: done                # CODE REVIEW DONE 2026-08-11 (Codex 3-pass, verified internally): 0 High / 2 Medium / 4 Low. The Medium was found by TWO passes independently and was real - hasNoValue swept every non-string into "no value", so a malformed stored clan/bloodline read as absent and the write-once rule failed OPEN on the corrupt row it most needed to hold on. Narrowed to AC 2s literal list on BOTH the server module and its client mirror; unexpected shapes now count as A VALUE and fail CLOSED. Parity matrix extended to non-string shapes (it could not previously have seen a divergence there). Race 409 now names only the field that actually moved, at no extra read. Two false record claims corrected IN PLACE (both-succeed concurrency; the unreproducible 41/811 regression figure - now 40 files / 804 tests with a named command and the known-reds excluded by name). Pass 2s seeded crash concern investigated and DISPROVED. All patches proved by single-change revert. 154 story tests / 212 touched+adjacent / 804 broad, green. PRE-REVIEW RECORD: IMPLEMENTED 2026-08-11 (dev-story), awaiting code review. Everything specced shipped. NEW FILES: server/lib/character-write-once.js (PURE, zero imports), server/lib/bloodline-key.js, public/js/data/write-once.js, plus two spec files (150 tests). PUT /:id: one hoisted+widened read shared with the touchstones branch, 409 WRITE_ONCE_VIOLATION on a forbidden transition, 400 VALIDATION_ERROR on a non-resolving ACQUISITION only, compare-and-set on acquisitions (no-op saves gain NO filter condition), and a lost compare-and-set returns 409 not 404 - a defect the tests found, not a reading. THE RULE IS NECESSARILY IMPLEMENTED TWICE (Netlify vs Render; neither tree can import the other) so a PARITY BLOCK runs a 128-pair matrix through both modules - declared as a deviation-with-mitigation, not hidden. Client tests went into a SECOND file (bl5-lineage-lock-client.test.js) for the vi.mock/resetModules-vs-live-Mongo reason BL-2 and BL-4 both hit; also declared. ZERO new CSS: disabled + title + the existing .derived-note, via two shared markup helpers so the four call sites cannot diverge. edit.js:107-125 DELETED with both dead cache imports, bane kept, proved at the CALL SITES. Two bl3a assertions INVERTED to the stronger BL-5 guarantee with the reasoning in the test body, rather than deleted. 811 green across 41 suites; NUL guard green at its 60s timeout; the 4 known pre-existing reds re-confirmed unrelated. BROWSER VERIFICATION CLOSED (the epic's open gap since BL-2): locked controls + reasons observed live on BOTH screens against production data, five forbidden writes refused live with the dirty flag never firing, acquisition path confirmed still open, (not set) placeholder rendered; write-path outcomes proved on tm_suite_test because the local API points at LIVE Atlas and the refusal is not worth observing at the price of being wrong about it once - production re-read afterwards and unchanged. NOTE FOR THE REVIEWER: bloodline-name-index.js:45 still carries a duplicate private normKey (out of scope by name, flagged in that file's header); data-map.md NOT edited, three ready-to-apply corrections are in Completion Note 10; the bulk-import restore paths will now 409 on a differing stored value, which is correct and deliberate but is a live behaviour change nobody has exercised yet. Issue #1132 (audit-logging) NOT touched. MERGE STILL GATED on BL-3b's open AC 9 (production holds 0 bloodline documents - seed first). Nothing committed, nothing pushed. # STORY WRITTEN 2026-08-11 (bl-5-character-bloodline-validation.story.md, 15 ACs). NO SPLIT - assessed and rejected with reasons: the two halves cannot be separated (client lock without the server guard is theatre, the API is the bypass; server guard without the client lock is an ST hitting a 409 from a dropdown that still looks live), and splitting reproduces the one-rule-two-implementations shape BL-3a existed to remove. Larger than BL-3a, materially smaller than BL-4. THE "(none)" DISPLAY DEFECT IS ALREADY FIXED, verified in full on BOTH surfaces - BL-3a's review fix 4 unions the character's own stored value into the option list at identity.js:27-31 and sheet.js:34-42 (_blOptionNames), case-insensitively and escaped; the surfaces have NOT diverged. The story records it closed and does not re-litigate it; data-map.md still describes it as live and is flagged for correction (flag not fix, per data-lock discipline). SERVER CHECK PLACEMENT: a new PURE server/lib/character-write-once.js following bloodline-delete-guard.js (no DB, no Express, injected IO), called from the PUT handler - NOT a sibling middleware next to validateCharacterPartial, because every middleware in that chain is body-only and a transition rule needs the STORED value, so a middleware would open a second findOne of the document the handler already reads at :485. That read is hoisted and widened to { clan: 1, bloodline: 1 } and shared with the touchstones branch: one extra read, only when a guarded field is present. '' VS null RESOLVED: '' is "no value", via one shared predicate covering null/undefined/absent/''/whitespace-only. Not tidiness - character.schema.js:70 puts '' IN THE CLAN ENUM and :74 leaves bloodline an unconstrained ['string','null'], so a bare "=== null" check would let 'Malkovians' -> '' through as an allowed no-change, which is the bypass. THE NO-OP CASE IS LOAD-BEARING: admin.js:1015/:1240 PUT buildSaveBody(c), the WHOLE document, carrying clan and bloodline unchanged on every save - a guard refusing "field present in body" rather than "field value changed" breaks every character save on day one, and an explicit test pins it. Atomicity: acquisitions become a compare-and-set (prior value in the findOneAndUpdate filter), answering BL-4's concurrency register without a transaction; no-op saves gain no filter condition. Wizard/POST paths explicitly NOT guarded and asserted so - a creation is not a transition. Referential check survives from the original scope line but narrowed to acquisitions only, matched on the trim+case-fold key, and REFUSING TO JUDGE against an empty collection (production holds 0 bloodline documents; a check that fires against an empty collection rejects every first-set in the app). Client: shared refusal called from BOTH updField and shEdit (handler first, markup as defence-in-depth, per data-map's own instruction), four dropdowns locked across two files, lock keyed off the CHARACTER'S OWN stored value and never the cache (a cache-keyed lock unlocks everything while the collection is empty). Zero new CSS - disabled + title matching sheet.js:673's _discLockAttr, visible reason via the existing .derived-note (components.css:399, loaded by both apps); NOT BL-4's .ec-form-* (admin-layout.css, different surface) and NOT .bl-disc-locked (error-coloured, this is not an error). NEW FIND: the clan selects have no "not set" placeholder on either screen, so an unset clan renders Daeva visibly selected - latent today (41/41 have a valid clan) and closed by the lock for existing characters, but the acquisition path still needs it. edit.js:107-125 DELETED with its two now-dead cache imports, bane assignment at :101-106 KEPT, deletion proved by CALL-SITE test using BL-3b's shared strip-comments helper (BL-3a shipped a ReferenceError from exactly this class). DATA-LOCK: not required as a separate pass - measured during story creation instead, by direct query: 41 characters, bloodline null x28 / non-empty string x13, ZERO '' and zero absent on either field, clan a non-empty valid CLAN_NAMES string on all 41, 13/13 holders' clan matching their bloodline's clan (data-map's claim re-verified independently), bloodlines collection still 0. AFTER-GAME-7 GATE DOES NOT BIND THE CODE: every surface is ST-only (app.js:325/1232 gate the editor behind getRole()==='st' in both apps; PUT is requireRole('st')), no player-facing surface, no costing path, no DT form change. The gate still binds the epic's MERGE via BL-3b's open AC 9. Open questions for Angelus: (1) there is deliberately NO in-app remedy for a mis-entered value and BL-4's delete guard also blocks cleaning up the catalogue around it - story assumes a direct Mongo correction named in the 409 message; a correction script is option (b) and its own story; (2) refuse-and-record vs refuse (no character-audit-log surface exists to write to). # ORIGINAL SCOPE: Server-side validation of characters.bloodline against the collection. AFTER a pass confirming all live values resolve. NO LONGER SMALL, and no longer a BL-4 rider: Angelus ruled 2026-08-10 that characters.bloodline is WRITE-ONCE (null -> a name is allowed; name -> different name and name -> null are not). Nothing enforces it and two client defects break it today - edit.js:104 silently nulls the bloodline when clan changes, and identity.js:73-75 renders "(none)" for a character whose bloodline is not in APPROVED_BLOODLINES, so the ST reads a false value and the next touch commits it. ALSO ruled 2026-08-10: clan is write-once too, so edit.js:102-104 bloodline-clearing is unreachable and gets DELETED (keep the bane assignment - still needed on first set). Both fields have TWO editing surfaces that must both be locked: identity.js:69/73 via updField, and sheet.js:2692 via shEdit. Full entries: data-map.md, characters.bloodline and characters.clan.
