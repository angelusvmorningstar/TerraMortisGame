i/office_seats/:seatId/holder is now the one place a court office changes hands: it keeps characters.court_category and office_seats.holder_id in step atomically, refuses (409, naming the seat) rather than cascading when the target already holds a different seat, and resets that seat's manoeuvre rank to 0 while accumulating a manoeuvre_xp_destroyed counter in the same aggregation-pipeline update - because office spend is DERIVED from the current rank, so zeroing it without the counter would REFUND the XP office-powers.md says is destroyed. The arithmetic is deliberately handed forward to oxp-6/oxp-7 and recorded in oxp-6's entry, since office-xp.js has no consumer yet. admin/city-views.js's court panel is now seat-backed and makes no /api/characters/ call at all; its Add-slot and remove-slot buttons are removed rather than rewired, which leaves in-app seat creation as a real gap flagged for Angelus. Two deliberate deviations from the story text, both recorded in oxp-5's own entry and both worth a reviewer's eye: the compare-and-swap baseline is read BEFORE the transaction opens (withTransaction re-runs its callback on a transient WriteConflict, so a baseline read inside it would let the retry re-read the winner's result and succeed, producing two 200s and two resets), and AC6's updateOne is a findOneAndUpdate so the pre-image can report what was actually destroyed. AC10's mandated exactly-one-200-one-409 race assertion was measured to be flaky (two Promise.all requests interleave only about 4 times in 5; the fifth is a legitimate sequential pair) and was replaced with a 10-iteration invariant loop per issue-1143's own convention. Full seven-file targeted gate 204/204, run three consecutive times identically, zero skipped. Verification after the first dev pass found two bugs, both written up in oxp-5's own entry and its Dev Agent Record: one real (this suite's fixture cleanup ran unfiltered deleteMany({}) on the two shared purchase collections, now scoped to its own seat ids) and one that turned out not to be a bug in this story at all (a large non-deterministic failure spread across four unrelated files, root-caused and REPRODUCED as two vitest processes running against the shared tm_suite_test database at once - a real, pre-existing, unguarded harness limitation, since setup-env.js redirects only the database name and nothing detects a second concurrent run). All three mandated prove-discrimination checks run one at a time and reverted: inverted pipeline stages failed exactly the 5 counter tests, a removed conflict check failed exactly the 3 refusal tests, a disabled same-holder branch failed exactly the 5 no-op tests. Live tm_suite never touched. The pre-existing oxp-1-office-seats.test.js load failure (the shebang in seed-office-seats.mjs) is unchanged and untouched. Prior entry follows. oxp-11 IMPLEMENTED, status review, not yet reviewed and not yet committed. office_merit_dots and office_manoeuvre_ranks re-keyed from office category to SEAT, closing a gap deferred three times (oxp-1 Finding 3, oxp-3, oxp-4) that became a hard blocker for oxp-5: under category-keying, resetting the single shared Primogen document on one seat's handover would also have wiped the other seat's unrelated progress. Angelus's ruling, asked directly: full migration, not a multi-seat carve-out; scope backend plus minimal client wiring only, no seat-picker UI (that stays oxp-6). New: server/lib/office-seat-resolve.js (the one shared 24-hex validate-and-look-up helper, so neither route grows its own drifting regex), server/scripts/migrate-office-purchases-to-seats.mjs, server/tests/oxp-11-office-purchase-seat-keying.test.js. The migration script deliberately has NO shebang: the one in seed-office-seats.mjs is what breaks vitest's transform and leaves all 41 of oxp-1's tests unrun, and this script IS imported by a test suite. IT HAS NOT BEEN RUN against live tm_suite; that is Angelus's action, and the live data is untouched. 187 tests passed / 0 failed across the four reworked suites, the new suite and the two adjacent ones, with mongod genuinely available so the DB-backed independence and handover proofs really ran rather than skipping. Both load-bearing gates prove-discriminated by single-change mutation: collapsing seat resolution back to the category failed exactly the AC8 independence tests, and turning the migration's ambiguity refusal into 'pick the first seat' failed exactly the refusal test. The pre-existing oxp-1-office-seats.test.js load failure is unchanged and was not touched. Prior entry follows. Merge of the three Epic OXP PRs into main: oxp-1 (#1160, seat-keyed schema), oxp-3 (#1158, manoeuvre graduated purchase), oxp-4 (#1159, merit-purchase handover persistence) all merged. oxp-3's own last-updated entry follows, then oxp-1's. oxp-3 REVIEWED AND DONE. External Codex review (3-pass isolated, reasoning_effort=high) returned 0 High, 5 Medium, 4 Low; every finding independently reproduced before any patch. THREE Medium patched: (1) a rejected GET /api/office_manoeuvre_rank left the holder's manoeuvre list in its optimistic unmuted first-render state, silently reading as 'all five purchased' when the real rank was unknown and might be 0 - the list is now replaced with a Could-not-load message matching _wireMeritDots's own sibling idiom; (2) an adjustment resolving after a category switch repainted the newly selected office with the previous one's rank and rows - closed with a render-generation counter stamped on the tab root el itself (office-approvals.js's _fetchGen precedent, but anchored to the element rather than module scope because this root is re-rendered repeatedly for the same el), captured before the first await and re-checked before every DOM write; (3) a genuine lost-update race in the stepper - the client read the rank, computed current+delta locally and PUT an absolute value, so two overlapping clicks both wrote the same next value - closed server-side with a NEW atomic PUT /api/office_manoeuvre_rank/:category/step (aggregation-pipeline findOneAndUpdate doing increment and clamp in one operation, upsert included), with the client now sending only the signed delta. The absolute-set PUT /:category is deliberately kept for direct-set use. ONE Medium was NOT a bug: Codex read AC2 (reference view reveals no purchase state) as contradicted by an ST/dev seeing the rank readout while browsing - Angelus ruled keep current behaviour, matching the already-shipped Merit Suite precedent and the ST-sets-up-an-office-before-handover case AC6 exists for; AC2's text was clarified to state it governs the MANOEUVRE LIST specifically (unchanged, and structurally clean - the muted class is never emitted at all in reference view), with the readout being AC6's widget and AC6's ST/dev exemption deliberate. A second Medium (all-8-ACs overstated while AC7's concurrency outcome was absent) is closed by patch 3; AC7's own text was rewritten off the re-fetch-before-write pattern it used to mandate, since that pattern WAS the defect. TWO Low patched (defensive clamp inside the exported manoeuvreRankHtml, which threw RangeError on a negative rank for any future caller; five-existing-tests corrected to four), one Low superseded (source-regex tests replaced for the async layer by three new tests driving renderOfficeTab -> _wireManoeuvreRank -> _adjustManoeuvreRank through a hand-rolled fake DOM with localStorage/fetch stubbed, the same no-jsdom technique otc.3's review established), one Low dismissed as environmental. On that last: Codex's gate found 9 files and 107 passed/49 skipped, from TWO causes - a wrong filename in the reviewer-supplied gate command (tests/oaq-2-pending-status-actions-accept-decline.test.js does not exist; the real file is tests/oaq-2-pending-status-actions.test.js) and Mongo EACCES caused by an orphaned concurrent codex exec process. After killing it and correcting the filename, the identical gate re-ran clean at 171/171 across 10/10 files with zero skips, matching the dev round exactly - same transient-Mongo-reachability pattern already recorded in otc-2 and oaq-2, both readings accurate for their own moment, recorded not reconciled. All three fixes prove-discriminated by SINGLE-CHANGE revert: fix 1 failed exactly its own 2 tests; fix 2 failed exactly 1, the stale-category test, with the right message (Enforcer's mount showing Primogen's rank); fix 3 failed exactly 3 across three consecutive runs, the first as a real expected-4-to-be-3 lost update - note the concurrency test fires FOUR simultaneous steps, not two, because two racers did not reliably interleave and would have made the guard flaky. Final regression 186/186 across 10 files, zero skipped (up from 171, 15 new tests). No unresolved High/Medium. DEFERRED, not patched: office-merit-dots.js and _adjustMeritDots carry the IDENTICAL read-then-write lost-update race, pre-existing since PR #1147, untouched by this diff, found only because oxp-3 copied the pattern - filed in specs/deferred-work.md with the same relative-step fix shape. oxp-1 DONE. External Codex review round applied: 1 High patched (the ISO-date pattern accepted calendar-impossible dates like 2026-99-99 at both the schema and the seed script, on the field that feeds oxp.2's XP arithmetic; fixed with a range-bounded pattern plus a UTC round-trip calendar check, because V8's Date.parse silently rolls 2026-02-30 forward rather than failing), 1 Medium patched (find-then-insert replaced with an atomic $setOnInsert upsert, after reproducing 13-19 documents from 4 concurrent seeds where 7 were expected), 2 Low patched, 2 Low were record corrections, 1 Low needed no action. Gate re-run here: 121/121 across 6 files, zero skipped, confirming the original 112/112 exactly. The seed script has still never been run for real and the live tm_suite database was never touched. Full detail in the oxp-1 and oxp-3 entries below and in each story's Senior Developer Review section.)"
