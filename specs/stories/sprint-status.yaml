ing, plus a denormalised self-healing office_category that is never the key and never authoritative). One shared resolver, server/lib/office-seat-resolve.js, turns :seatId into a seat for both routes: 400 on a malformed id, 404 on an unknown seat, 400 on a seat whose office has no OFFICE_DATA entry (Administrator, until oxp-8). The manoeuvre step route keeps its atomic aggregation-pipeline findOneAndUpdate and its [0, manoeuvres.length] clamp; office_category rides in the existing second $set as a $literal so it composes with the upsert path. Client: office-tab.js gained _wirePurchaseState, ONE GET /api/office_seats per render pass feeding both wiring functions, holder match for your own office, deterministic fallback (ascending created_at then _id) otherwise, an on-screen note naming the seat whenever the category has more than one, and explicit no-seat / seats-unavailable states instead of a plausible row of zeros. Migration script server/scripts/migrate-office-purchases-to-seats.mjs is dry-run by default, idempotent, insert-then-delete, and REFUSES both the no-seat and the ambiguous multi-seat cases rather than guessing; NOT YET RUN against live tm_suite, which is Angelus's action. Tests: 187 passed across the 4 reworked suites plus the new oxp-11 suite and the two adjacent ones, 0 failed; the pre-existing oxp-1-office-seats.test.js load failure (the shebang in seed-office-seats.mjs) is unchanged and untouched. Prove-discrimination run on both load-bearing gates. ORIGINAL STORY NOTE FOLLOWS. STORY CREATED 2026-08-13. Migrates office_merit_dots and office_manoeuvre_ranks from category-keying (_id: 'Primogen', ONE document per office) to SEAT-keying (_id: the seat's own office_seats._id as a 24-hex string), so Primogen's two live seats (Yusuf Kalusicj, Rene St. Dominique) and Socialite's two (Brandy LaRoux "Harpy", Carver "People's Harpy") can hold independent purchase state. This gap was flagged and deliberately deferred THREE times - oxp-1's Finding 3, oxp-3's "What this story is NOT", oxp-4's scope notes - each on the correct grounds that neither multi-seat office had actually had a real purchase yet. WHAT CHANGED: the gap became a hard blocker while scoping oxp-5 (handover/reset). A read-only consumer like oxp-2 could punt gracefully with spendKnown:false; a WRITE path cannot, because resetting the single shared Primogen manoeuvre document on one seat's handover would also wipe the OTHER seat's unrelated progress. Angelus's ruling, asked directly (2026-08-13): "then so something like code them as Primogen 1 and Primogen 2, treat each of them as a unique seat that wipes independently" - full migration, not a multi-seat carve-out or exclusion list. Scope call, also his: BACKEND PLUS MINIMAL CLIENT WIRING ONLY. Explicitly NOT a new seat-picker UI letting an ST browsing Primogen as reference choose WHICH seat to look at - that is real UI work belonging to oxp-6, which has not been built even for today's category-only model. LIVE DATA RE-CONFIRMED read-only for this story 2026-08-13: office_merit_dots still holds exactly 2 documents (Enforcer, Head of State, both SINGLE-seat offices so each maps unambiguously to one seat), and both contain exactly {"Safe Place": 0} - there is NO non-zero purchase data anywhere in either collection, so the real data-loss risk in this migration is near zero and the story says so rather than overstating it. office_manoeuvre_ranks is still completely empty (0 documents), so nothing to migrate there beyond the schema/route change. All 7 office_seats documents still match exactly one character by holder_id, with no orphans in either direction, so the client seat resolution will succeed for every real holder on the day this ships. ARCHITECTURAL CHECK, done rather than assumed: re-keying by seat _id PRESERVES oxp-4's proven merits-persist-across-handover guarantee server-side rather than breaking it, because a seat's _id is minted once and never changes while a handover moves only holder_id, which is 