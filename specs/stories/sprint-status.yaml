rified to state it governs the MANOEUVRE LIST (unchanged, and structurally clean: the muted class is never emitted in reference view at all, so a browsing player's DOM carries no purchase state), the readout being AC6's widget with a deliberate ST/dev exemption. 1 Medium (all-8-ACs claim overstated without AC7's concurrency outcome) closed by patch 3; AC7 rewritten off the re-fetch-before-write pattern it originally mandated, since that pattern was itself the defect. 2 Low patched (clamp inside the exported manoeuvreRankHtml, which threw RangeError on a negative rank; five-existing-tests miscount corrected to four), 1 Low superseded by 3 new fake-DOM tests driving the real async wiring end to end (no jsdom in this project - same hand-rolled technique as otc.3's fake <select>, with localStorage and fetch stubbed the way this file's header already stubs location), 1 Low dismissed as environmental: Codex's 9-files/107-passed/49-skipped gate result came from a wrong filename in the reviewer-supplied command (tests/oaq-2-pending-status-actions-accept-decline.test.js, real file tests/oaq-2-pending-status-actions.test.js) plus Mongo EACCES from an orphaned concurrent codex exec process; after killing it and correcting the filename the same gate re-ran clean at 171/171 across 10/10 files, matching the dev round - same transient-reachability pattern already recorded in otc-2/oaq-2, both readings accurate for their own moment. All 3 fixes prove-discriminated by single-change revert (2 / 1 / 3 expected failures respectively, nothing else moving; fix 3 verified over three consecutive runs, its concurrency test firing FOUR simultaneous steps rather than two because two racers did not reliably interleave). Final regression 186/186 across 10 files, zero skipped, up from 171. No unresolved High/Medium. Story: oxp-3-manoeuvre-purchase-graduated-merit.md
