tion is not itself vulnerable to the positional-addressing hazard it exists to fix, sets exactly one field so it can never clobber a concurrent edit, idempotent, never overwrites an existing key. HARD CONSTRAINTS written into the story's own 'What this story is NOT': do NOT change any existing fact's st_hidden (all 442 are true, and ANGELUS'S CALL verbatim - 'I have yet to set what is revealed, so starting hidden is correct' - so today's all-hidden state is correct, not a bug to fix) or revealed_to (zero facts carry one, zero must after); do NOT build any reveal writer, admin UI, Cockpit UI or API route here; do NOT flip wiki_config.fact_level_enabled (TM Wiki's own repo and action); do NOT run --apply against live tm_suite (Angelus's action, same standing convention as dbo-1/dbo-4/dbo-8); do NOT add a MongoDB $jsonSchema validator (the collection has none today, no route validates against it); do NOT touch the seven one-off historical server/scripts/_*.js dossier writers - only _dossier-audit.js, and only its dead import. ONE GENUINELY NEW FINDING, baked into an AC: TM Wiki's shipped filterVisibleFacts (../TM Wiki/server/routes/characters.js:210-214) reads 'if (fact.st_hidden !== true) return true' - FAIL-OPEN - so any fact minted without st_hidden is silently visible to everyone; st_hidden is therefore required on every fact, costing nothing today since all 442 already carry it, and closing a real default-open hazard for every future writer. DELIBERATE NON-ENUMS with stated reasons: tag stays a plain string (DOSSIER_TAGS is a known-tag DRIFT-REPORTING set per _dossier-audit.js:13-14, not a rejection list - enum-ing it would contradict the script the export exists to serve), fact source stays a plain string (_rene-disambig.js:11 filters on source:'st', a value no live fact carries, so the vocabulary is demonstrably not closed), status stays a plain string (one live value 'outstanding', nothing reads it, a debt plausibly gains 'settled' later); severity IS enumed (m