ew - +2 for the new empty-list-guard and post-fetch-throw tests). Full raw findings at specs/stories/code-review/oxp-7-sheet-office-merits-section-codex-findings.md; full narrative at oxp-7-sheet-office-merits-section.md's Senior Developer Review section. Standing order from Angelus (2026-08-14) held individual merges until the whole epic was ready - MERGING to main 2026-08-15 alongside oxp-6, shipping Epic OTC/OAQ/OXP together ahead of Game 7, exactly the condition the standing order was waiting for. DEV COMPLETE 2026-08-14, prior to code review, NOT committed. Delivered per all nine ACs: shRenderOfficeMerits(c)/patchOfficeMerits(c) landed in public/js/editor/sheet.js (byte-identical-suite-and-editor rationale, same as Domain/Influence Merits) between shRenderDomainMerits and shRenderStandingMerits; resolveHeldSeat(char, seats) extracted to a NEW public/js/data/office-seat-resolve.js (confirmed-only, no fallback guess) and office-tab.js's _wirePurchaseState now calls it too, proving one shared implementation rather than a second copy; renders nothing for no-court_category, unconfirmed holder match, Administrator, empty merit list, or a failed fetch; fetches GET /api/office_seats + GET /api/office_merit_dots via apiGet with the same missing-key-means-0 convention office-tab.js uses; dots via shDots(n), purchased-only, explicitly not the hollow-to-cap conventions; sh-sec/sh-sec-title/merit-list wrapper inserted in suite/sheet.js right after shRenderDomainMerits(c, false); async fetch-and-patch mirrors status.js's appendOfficeActionsLog precedent, slot keyed by data-office-merits-char (not a hardcoded id, since renderSheet can populate more than one container), module-scoped _officeMeritsGen render-generation guard mirroring office-tab.js's own el._officeManoeuvreGen pattern; zero new CSS. REAL BUG FOUND AND FIXED DURING DEV, in the TEST not the source: the new oxp-7-sheet-office-merits-section.test.js never stubbed globalThis.localStorage, so api.js's headers() (called synchronously before fetch, reading the auth token) threw a ReferenceError that patchOfficeMerits's own AC3 catch{return;} silently swallowed - 3 tests were passing for the wrong reason (a coincidentally-correct empty result via an unrelated crash, not the real unconfirmed/failed-fetch path). Fixed with the same Map-backed localStorage shim issue-1141-office-tab-render.test.js already uses; not a source defect. TESTS: 18 new in oxp-7-sheet-office-merits-section.test.js (7 pure resolveHeldSeat, 4 synchronous-shell, 6 async-patch, 1 render-generation-guard), full targeted gate with issue-1141-office-tab-render.test.js = 75/75. Also ran all 18 test files in the repo that reference editor/sheet.js or suite/sheet.js as an extra check beyond AC9's own scope: one pre-existing failure already documented in TM Suite's CLAUDE.md (n7-n9-allocator-readers.test.js, #1115) plus two pre-existing broken files unrelated to this diff (issue-836-legacy-tracker-cache-removed.test.js - ENOENT on a since-moved suite/tracker.js; n8-mandragora-prereq.test.js - syntax error), both confirmed present on the unmodified tree via git stash before being ruled out as this story's problem. Three single-line prove-discrimination passes, each reverted and re-verified green: AC2's shared extraction (office-tab.js's held computation reverted to null failed exactly 6 tests in issue-1141-office-tab-render.test.js, from Task 1); AC7's render-generation guard (neutralising the gen check failed the late-resolving-fetch test); AC3's confirmed-only gate (neutralising the !seat check failed the unconfirmed-match test via the expected downstream null-seat TypeError). Live tm_suite never connected to or written to. Story: oxp-7-sheet-office-merits-section.md. DEV STARTED 2026-08-14. STORY CREATED 2026-08-14 (oxp-6 done, code-reviewed, committed). Story: oxp-7-sheet-office-merits-section.md. Research pass (before writing ACs) found shRenderDomainMerits's read-only branch is 200+ lines of Collective-Compound/Ne