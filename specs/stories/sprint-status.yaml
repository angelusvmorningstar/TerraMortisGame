  issue-1141-office-data-sync: done                   # Story created 2026-08-11 from #1141. The live "Office" player tab (office-tab.js / office-data.js, shipped via #691, closed 2026-06-11) renders pre-Symon Court Position content - Symon rewrote all 20 manoeuvres this session, consolidated with full design rationale into content/rules/office-powers.md (umbrella, not this repo). Found independently while scoping: OFFICE_DATA carries the SAME bug confirmed in the print pipeline - three of four positions' merits arrays duplicate the office's own asset name as a bogus fifth merit chip, transcribed straight from Terra Mortis Offices.xlsx's buggy VLOOKUP formula (every office tab pulls Merit Suite twice instead of the true Merit 5). Scoped tight on purpose: content sync + the one bug fix only. Explicitly NOT in scope - the office XP economy (1 XP/month per office, holder-purchased manoeuvre ladder, merits persist/manoeuvres reset on handover, fully specified in office-powers.md but nothing in this codebase implements any of it), the Administrator's manoeuvres (known gap, parked by Angelus), migrating OFFICE_DATA off a static JS module (flagged for whoever picks up the XP-economy story, not acted on here). Verified before writing the story: OFFICE_DATA has exactly two consumers (office-tab.js is the only importer), no existing test hardcodes the old content (#691's own test suite never references OFFICE_DATA), hasOffice/court_category have no uniqueness constraint so two concurrent Socialite holders (the canon appointed+popular seats per TM Wiki's setting-primer.md) already just work. LANDMINE FOUND AND ROUTED AROUND: office-tab.js imports api.js, which reads location.hostname at module top level - importing it into this project's plain-Node vitest (no jsdom configured) throws immediately. office-data.js itself has zero imports and is safely testable directly; the story routes all automated assertions through that import and proves the two DOM-dependent ACs (Administrator fallback, two-Socialite-holder independence) by construction/code-reading instead of a render test, since renderOfficeTab is a pure function of its arguments with no shared state and the fallback branch is unchanged by this story. Branch: ms/issue-1141-office-data-sync (off main 7db3b0a1). IMPLEMENTED 2026-08-11: T1 content synced, T2 bug fixed (asset-duplicate removed from 3 of 4 merit arrays, Enforcer asset renamed Task Force -> Goon Squad). Genuine red-green: server/tests/issue-1141-office-data-sync.test.js 12 failed/9 passed pre-fix -> 21/21 post-fix, failure diffs matched the documented old-vs-new content exactly. T4 upgraded beyond the story's own plan - rather than a declared deviation (this project's pattern when a full render check isn't practical, per #1137's AC2), ran a genuine Playwright/Chromium check calling renderOfficeTab directly against 6 REAL characters.court_category holders fetched fresh from MongoDB (Eve Lockridge/Yusuf Kalusicj/Einar Solveig/Brandy LaRoux/Carver/Ivana Horvat), bypassing app.js routing and the Discord/dev-fixtures auth path entirely since dev-fixtures serves a stale April export that predates Carver's Game 6 creation as the popular Socialite seat. All 8 ACs passed, including AC6 (two concurrent Socialite holders, Brandy + Carver, render independently with no collision) and AC7 (Ivana Horvat/Seneschal genuinely renders the "pending" fallback) with real DOM evidence, not just code-reading. Full regression run (171 vitest suites, local mongod): 10 files / 5 tests failed, 2330/2335 passed. n7-n9-allocator-readers.test.js is the documented #1115; the other 9 failing files are NOT in CLAUDE.md's pre-existing-failure list and were confirmed unrelated by exhaustive grep (none reference office-data.js or office-tab.js) - not fixed, out of scope, but CLAUDE.md's "1 known failure" undersells the real count and is worth a separate correction pass. EXTERNAL REVIEW (Codex CLI, model_reasoning_effort=high, 3-pass, this project's first use of the new TM-Wiki-mirrored bmad-code-review override): 2 real Medium defects found and fixed. (1) AC6 had no permanent regression test - the story's "proof by construction" reasoning substituted for a test the AC explicitly asked for. Fixed: server/tests/issue-1141-office-tab-render.test.js added, importing office-tab.js directly via a globalThis.location stub (proven safe independently by two of the three reviewers before this session tried it), scoped to beforeAll/afterAll so it cannot leak into other suites sharing this project's single-fork vitest worker. (2) The Manoeuvres heading "(each costs 1 Influence)" is false for 9 of 20 rewritten powers (several now cost City-Status- or Ambience-scaled Influence) - found independently by all three review layers via three different methods (text reading, code reading, live Chromium render). Fixed: office-tab.js one-line removal, a defect this story's own content change caused, not new logic. Both patches prove-discriminated with revert/restore cycles. Six documentation-accuracy findings against the story's own record also confirmed and corrected in place: a self-contradicting merit-count claim, a RED-breakdown overclaim (Enforcer's manoeuvre NAMES were unchanged, only effects), an overstated "exactly two consumers" claim, an internally-inconsistent "all six office seats" note (real finding: SEVEN characters hold offices right now, not six, because Primogen ALSO has two concurrent holders alongside Socialite - re-verified live via MongoDB during triage), an overstated CLAUDE.md-scope claim, two off-by-one line counts. T4's live-character claim, which the Auditor's own sandbox couldn't verify (network EACCES to Atlas, no local mongod, stale April fixture fallback), was independently closed two ways: the Auditor's own from-scratch Chromium reproduction, and a fresh live Mongo query run during triage matching all six _ids exactly. Final regression (changed-area): issue-1141-office-data-sync.test.js + issue-1141-office-tab-render.test.js + feature.691.hos-city-status-power.test.js - 55/55 passing. No unresolved High/Med remains. Status: done. Story: issue-1141-office-data-sync.story.md

  issue-1137-collective-pool-producer: done           # Story created 2026-08-11 from #1137. Collective Compound pool PRODUCER is hardcoded in mci.js: four applyPoolRulesFromDb calls (VM :91, Invested :106, Lorekeeper :112, Necropolis :121) and NONE for Blood and Sacrifice or Prayer and Penance, both seeded 2026-08-06. rule_grant data is correct; the producer never runs, so _grant_pools stays empty, poolAvailableFor returns capacity 0 and the per-target stepper refuses any value. Reproducible on Anichka (Blood and Sacrifice 3, zero allocations). SECOND RECURRENCE: #1110 generalised the RENDERER and left the producer hardcoded, and its own Dev Agent Record recorded the false claim that "Crone and Sanctified owners have had correct pool capacity all along" - true that the evaluator is generic, false that capacity worked, because nothing calls it for those sources. Fix is a data-driven sweep; verified ONE call passing the whole rule_grant array suffices because applyPoolRulesFromDb already filters grant_type=pool + condition=merit_present and loops per rule. Ordering verified irrelevant (_ratingOfPartner reads cp+xp only, and no pool rule references Invictus Status). ONE fix site only - server/lib/rule_engine/_legacy-bridge.js is a 5-line re-export, no parallel implementation. Non-regression verified live: Yusuf Kalusicj and Xavier Boussade both Necropolis 5 at exactly 5/5 fully allocated. Nobody holds Prayer and Penance, so that AC is fixture-only. IMPLEMENTED 2026-08-11: four hardcoded calls -> one sweep (applyPoolRulesFromDb(c,{grants:getRulesCache()?.rule_grant||[]})), exactly one pool call site now and zero per-source dispatches. Genuine red-green: 5 failed -> 8 passed, and AC4 (Necropolis) PASSED in the RED run, proving the test discriminates the real defect. The RED run also exposed a flaw in my own test (mocking getRulesCache alone starves getRulesBySource, which reads the module-internal _cache) and the SAME unfaithful mock in two COMMITTED suites - pool-parallel-write and vm-parallel-write both returned rule_grant:[] as a non-null #249 sentinel while serving real rules per-source, a state production cannot reach because load-rules.js:55 builds getRulesBySource by filtering _cache.rule_grant. Both corrected. REAL CONTRACT CHANGE worth knowing: the producer now needs the whole cache, not per-source lookups. N-7c dispatch guard rewritten - it asserted the Necropolis literal, which is itself why the bug recurred (it only ever looked for Necropolis), and now asserts the sweep plus no-relapse. Live check vs production data (28 real rule_grant docs): Anichka darktemple capacity 3 / available 3 (the stepper cap), Yusuf and Xavier necro 5 / available 0 (both 5/5 allocated, unchanged). 239/240 green across 22 applyDerivedMerits suites; the 1 failure is pre-existing #1115 in merits.js, untouched here. AC2 verified by capacity not by driving the browser stepper - see Declared deviations. MERGED AND DEPLOYED 2026-08-11 on Angelus's explicit "commit and deploy": commit a9361975 -> PR #1139 -> main ad8d7c21, issue auto-closed, Netlify + Render building from main. Frontend-only in effect (mci.js and pool-evaluator.js ship to the browser; only tests changed server-side). OUTSTANDING: nobody has yet eyeballed Anichka's DARKTEMPLE stepper on the live site - AC2 was verified by capacity (poolAvailableFor returns 3, the value the stepper uses as its cap), not by a rendered counter. EXTERNAL REVIEW (Codex, 3-pass) 2026-08-11: 0 High, 7 Medium, 9 Low. It independently REPRODUCED the load-bearing claims by rebuilding base d6f641d7 in an isolated archive - RED 5 failed / 3 passed with AC4 passing before the fix, GREEN 8/8, 22-suite gate 239/1, and the sole failure reproduced AT BASE (24/1), confirming #1115 pre-existing. It also audited every _grant_pools consumer and found none order-dependent, which the author had asserted without proof. REAL DEFECT FOUND: the INVESTED_GRANT and LOREKEEPER_GRANT fixtures used a non-existent field (partner_merits; _computeAmount reads partner_merit_names/partner_merit_name), so both computed 0, no test asserted either pool, and the file claimed the fixtures were verbatim. Both pool_targets lists were invented too. Fixed against live docs and 3 tests added (Invested from Invictus Status, Lorekeeper summing BOTH partner merits, off-covenant Invested); 8 -> 11 tests, prove-discrimination confirmed. ALSO CORRECTED: the ordering proof was false in both the code comment and the Dev Notes - "pools read purchased dots only" is overbroad (vm_pool includes free_mci, flat exists) and "no pool rule references Invictus Status" is simply WRONG, live Invested has partner_merit_names:[Invictus Status]. The original check JSON.stringify-ed a PROJECTED query requesting fields that do not exist, so it returned a confident false - the absent-field-suspect-the-query failure. Conclusion still holds, now proved basis-by-basis: nothing after the sweep mutates cp/xp, c.status or free_mci, and NO evaluator writes c.status at all (OTS computes a render-time bonus). AC5 reworded from "byte-identical" (literally violated by array reordering) to what the change guarantees; completion claim, evaluator JSDoc and the AC7 note all corrected. DEFERRED 3: the Rules Data authoring path cannot create merit_present rules (missing from UI selector AND schema enum, so AC6 holds only via a direct DB seed - wants its own issue); split-source compounds (ownsCompound gates on sharing_scope.merit, producer gates on source - needs a PRODUCT RULING, do not guess); duplicate pool rules multiply capacity (pre-existing, zero duplicates live). Post-patch: 11 passed focused, 242 passed / 1 failed across 22 suites (the 1 is #1115, pre-existing). Live capacities were UNVERIFIABLE by the reviewer (privacy-blocked), not disputed. MERGED AND DEPLOYED 2026-08-11 on Angelus's explicit "commit and deploy": commit a9361975 -> PR #1139 -> main ad8d7c21, issue auto-closed, Netlify + Render building from main. Frontend-only in effect (mci.js and pool-evaluator.js ship to the browser; only tests changed server-side). OUTSTANDING: nobody has yet eyeballed Anichka's DARKTEMPLE stepper on the live site - AC2 was verified by capacity (poolAvailableFor returns 3, the value the stepper uses as its cap), not by a rendered counter. Story: issue-1137-collective-pool-producer.story.md

  issue-1122-pledge-pool-overcommit: done             # Story created 2026-08-31 from #1122, the other half of OATH-A (#1111): _pledgeFloorNote (edit.js _applyPledgeFloor) is correctly edit-time-only feedback, but a character can be over-committed (pledged > owned dots) on a fresh load with zero edits, because the floor gates only 1 of the 7 merit-write paths (#1128's own finding) - nothing renders anything until someone happens to re-edit that exact merit. IMPLEMENTED 2026-08-31: one new pure arrow fn _pledgeOvercommitNote(m) inside shRenderGeneralMerits (sheet.js, beside _oathPledgeNote so it shares the once-per-render _pledgeIdx), comparing buildPledgeIndex e.dots against meritRating(c,m) and returning '' unless pledged > owned strictly. FOUR call sites, not the two the AC says - each renderer forks AGAIN on m.granted_by, so edit-granted (:2291) + edit-plain (:2310) + view-granted + view-plain, all four wired and all four asserted; a granted-merit test exists precisely because that second fork is the easy miss. meritRating deliberately (ADR-010 D1b, matching pledgeableDots): it sums ten free_*/free_grants channels, so a cp+xp-only reading would have cried over-commitment on every correctly-funded MCI/compound-granted merit - pinned by its own test. Oath names de-duped via Set so two same-named oaths cannot print twice; the figure itself is buildPledgeIndex's already-summed e.dots, one notice per merit not one per oath. Copy: "Pledged 3, pool funds 1 - 2 dots short against Oath Of Fealty." (calm, factual, names the creditor, prescribes no remediation - the parked "renegotiate the oath" question); singular/plural pinned. Genuine red-green: new suite 10 failed / 7 passed at base -> 17/17, and the 7 that passed RED are the negative controls (covered pledge, pledged===owned boundary, no-oath, AC7 purity, floor-note-alone) which are SUPPOSED to pass at base - that is what makes the other ten discriminating. Test marker is "pool funds", NOT "Pledged N", because _pledgeBadge already emits the latter in both renderers and an assertion on it would have passed unmodified. T5 answered by reading edit.js:1065-1108 rather than assumed: the two notices are mutually exclusive ONLY in the instant after a binding edit (the floor raises owned to EXACTLY pledged, so strict > fails), but `delete m._pledgeFloorNote` at :1071 clears only the merit under edit, so a note on X survives every later edit to Y and a subsequent ungated write below the pledge legitimately co-renders both - recorded, with tests from both directions, not asserted as false exclusivity. AC7 by construction (writes nothing onto m, so no strip step, called out per the AC rather than adding a no-op) plus JSON.stringify + Object.keys snapshots across a full both-modes render. ZERO CSS as predicted - .dom-cap-warn and the warn glyph reused verbatim, git diff touches no .css. T7: 114 passed / 1 failed across the four named suites; the 1 is oath-a-pledge-helpers' byte-identical-source assertion, a CRLF-vs-LF literal on xp.js/domain.js which this story never touches, proved pre-existing by `git stash push -u` A/B (identical 1 failed / 28 passed at base, same test, same line :388) not by citing CLAUDE.md. node --check clean. T8 DONE with a stated substitution (see Declared Deviations): live admin sheet NOT driven (no live character is over-committed - that is the story's own premise - and admin needs Discord OAuth), so instead a headless Chromium run rendering the REAL shRenderGeneralMerits output under the REAL admin stylesheet set, three panels (edit over-committed, view over-committed, both-notices co-rendering), computed colours read from the live CSSOM in both themes against side-by-side --warn-dk/--err probes: Parchment rgb(122,92,0) vs err rgb(139,16,16), dark rgb(212,168,50) vs err rgb(232,160,160) - Angelus's warning-not-error ruling verified as rendered pixels, not just a class name in a string assertion. Screenshots inspected: the note is a 10px own-line amber row below the bd-row (edit) / merit row (view); with _pledgeFloorNote also present the two stack as a related pair, no overlap or layout shift in either theme. NOT DONE, deliberately, flagged for Angelus: the "1 of 7 ungated write paths" gap that CREATES the over-commitment is still open (this story makes it visible, not impossible) and the story declines to file it; and a pledge against a domain/influence/standing merit still shows nothing at all (base OATH-A gap, re-verified by grep, not introduced here). Branch ms/issue-1122-pledge-pool-overcommit off main. COMMITTED (492185f1) before external review, per bmad-loop's own stable-base guidance. EXTERNAL REVIEW (Codex CLI, high reasoning effort, 3-pass) 2026-08-31: 0 High, 6 Medium, 3 Low. PATCHED 2: (1) per-oath dot breakdown in the "short against..." wording (was a bare deduped name list, now matches _pledgeBadge's own "Oath (N)" format), prove-discriminated; (2) ADMIN-ONLY gating - Codex found the indicator is ALSO player-visible via Suite's shared call to shRenderGeneralMerits, with alarming rather than reassuring wording, unlike the pre-existing Pledged/Sworn badges. Put to Angelus directly as a genuine tone/audience call (three options: soften copy / ship as-is / admin-only) rather than decided unilaterally - HE CHOSE ADMIN-ONLY. Implemented via a new showOvercommitIndicator parameter (default false, fully backward-compatible - spot-checked 68/68 across three unrelated consumers untouched by the signature change): admin's two renderSheet call sites pass true, Suite's call site is untouched and stays false by omission. Prove-discriminated both patches with single-line reverts. DEFERRED 2 (real, evidence-backed, genuinely out of this story's scope, written up in deferred-work.md): deleting a pledged merit makes ALL pledge display vanish for it AND exposes that ADR-010 D2's own claimed "editor refuses to reallocate pledged dots" guarantee is unenforced for full merit removal (shRemoveGenMerit has zero pledge check, confirmed by reading it) - needs a product decision before any code; legacy rating-only merits produce DIFFERENT "pool funds N" numbers in admin vs Suite because ensureMeritSync's in-place mutation flips which branch of meritRating's own fallback fires - pre-existing meritRating ambiguity, a real fix touches meritRating itself, out of this story's declared boundary. DISMISSED 2 Low (schema/AJV-blocked at every real write path, confirmed by an actual AJV probe not just reading; one is inherited unescaped-interpolation pattern already shipped in the pre-existing _pledgeBadge, unchanged). NOTED 1 Low: AC8's literal "tests green" wording vs the one pre-existing CRLF failure, independently reproduced a THIRD time by the reviewer's own from-scratch base rebuild - accepted as satisfied in spirit. Full targeted gate post-patch: 117 passed / 1 pre-existing failure (118), same failure as before either patch. node --check clean. No unresolved High/Medium remains. Status -> done. PUSHED and MERGED to main via PR #1232 (2026-08-31), after resolving a real conflict against TM Admin's Story 10.1b (shRenderMeritRow gained trailing (c, realIdx) params; kept alongside this story's _pledgeOvercommitNote(m) insertions). Story: issue-1122-pledge-pool-overcommit.story.md

