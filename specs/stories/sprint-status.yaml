  dbo-2-character-dossier-schema-and-reveal: done               # CODE REVIEW COMPLETE 2026-08-14 (external Codex, codex exec, model_reasoning_effort=high, full 3-pass adversarial protocol - Pass 1 blind diff-only, Pass 2 blind repo context, Pass 3a acceptance audit, Pass 3b record audit - against commit 2b187a7d). 8 findings: 5 Medium, 3 Low, NO High, no blocking defect. 5 PATCHED, 3 DISMISSED with evidence. Full raw findings: specs/stories/code-review/dbo-2-character-dossier-schema-and-reveal-codex-findings.md; full triage: the story own new Senior Developer Review section. PATCH 1 (the real fix, closing TWO findings that were one defect seen from two angles - Pass 1 reordered-array and Pass 3a AC5-not-implemented): applyBackfill was iterating row.indices computed at PLAN time and only re-reading the VALUE at each stale position, so an insert/delete/move between plan and apply could stamp whatever had shifted into a planned slot while silently MISSING the fact actually planned (self-healing on a later re-run, but wrong on that run, and contrary to AC5 literal wording that the same read producing the backup is the read the write decisions come from). It now recomputes the unkeyed positions from current.facts in the fresh backup read via a shared needsKey helper and never touches row.indices at all - the plan now contributes only WHICH DOCUMENTS to visit. The header comment, which had overclaimed this re-derivation, was rewritten to describe what the code actually does. PATCH 2: both the plan test and the DB-level update filter used PRESENCE (hasOwnProperty / $exists:false), so fact_key:null, fact_key:"" or any non-string would have been treated as permanently complete and no re-run could ever repair it - even though this story own schema declares {type:string,minLength:1} and rejects exactly those. Now a VALIDITY test in one shared place (needsKey plus its DB mirror needsKeyFilter): needs a key when typeof fact_key !== string or length 0. AC5 never-overwrite-an-existing-key is unweakened - it protects stable IDENTITY, which only a non-empty string carries, so minting over an invalid value is healing not overwriting; reasoning documented at the check. Zero live impact (0 of 442 live facts carry a fact_key of any value). PATCH 3: the TM Wiki reader is filterFactsForViewer (../TM Wiki/server/routes/characters.js:207, fail-open st_hidden!==true at :211), NOT filterVisibleFacts, which appears nowhere in that file - renamed at all 9 occurrences in this repo DBO-2 files (3 schema, 1 test, 5 story); the cited 210-214 line range re-verified correct; nothing in ../TM Wiki touched. PATCH 4: main() now also prints the collection total document count, because MongoDB selects a non-existent database name without complaint, so a typo-d MONGODB_DB reads an absent collection and reports the same clean 0 document(s) / 0 fact(s) a finished migration reports - report path only, planning and writing behaviourally unchanged. PATCH 5: the mixed fixture gained a fact with NO fact_key but an EXISTING revealed_to array, asserting it gains a valid key with that array byte-for-byte intact - correctly identified as a TEST GAP not a write defect, the single-field $set already preserved it. DISMISSED, with evidence, all three: (a) Pass 1 BSON-tolerant ID schema accepts arbitrary objects (Medium) - real and correctly reproduced, Ajv type:[string,object] does accept {} - but this schema is explicitly documentation-only (no $jsonSchema validator, no route reads or writes this collection), Ajv cannot express BSON ObjectId natively, the header already discloses object as the closest honest approximation, and tightening it needs a custom Ajv keyword function, disproportionate machinery for a declaration nothing validates against; (b) Pass 2 haven writer destroys stable identity (Medium) - real but NOT new: _havens-and-locations.js pull-then-push is the exact residual hazard this story own Dev Notes name, already logged to deferred-work.md under Deferred from dbo