  cm-2-chapters-to-story-cycles-rename: done               # Story created 2026-08-16: cm-2-chapters-to-story-cycles-rename.md. As originally scoped (cycle-model.md §3/§11): the chapters collection currently holds Story-groupings (mislabelled) -> story_cycles, chapter_id -> story_cycle_id. Precondition for the downtime_cycles->chapters rename below (frees the name). Ship + a short burn-in before touching the next rename. LIVE DATA RE-VERIFIED 2026-08-16 and §3's 2026-08-10 note is stale: THREE chapters docs now (Chapter 3 created on Game 7 night), 7 downtime_cycles grouped 3/3/1, every chapter_id a non-null string, zero orphans, no story_cycles collection yet - a clean 10-document rename with nothing to repair. Migration is copy-then-drop per the DBO standing order, with --drop-source as a SEPARATE opt-in flag: that makes the burn-in mechanical, since cm-2b literally cannot start while a chapters collection still exists. Full file-touch inventory in the story (14 files + 2 git mv + 2 new). Story flags 5 open questions for Angelus, incl. one real find: game_sessions.chapter_number currently holds the STORY number (2 for games 4-6, 3 for game 7) while ADR-010 D3a treats it as a per-game ordinal - latent, nothing computes on it today, ruled at cm-6 not here. DEV COMPLETE 2026-08-16 (Amelia): 13 ACs incl. a new AC13 (relayed via the coordinating session mid-implementation as Angelus's direct chat instruction that the three documents' own labels DO get rewritten, Chapter N -> Story N, in the migration's plan/apply path, narrow-matched so ST-authored prose is reported not guessed at). 2 git mv (history preserved), 2 new files, 15 modified. CODE REVIEW 2026-08-16 (internal 3-layer; Codex unavailable until 2026-08-20): 13 blocking patches landed with tests, each behavioural one proved by a single-change revert. The two HIGHs were both migration-safety: (1) no guard on the SHAPE of what lives in `chapters`, so re-running this script after cm-2b renames downtime_cycles->chapters would copy live game cycles into story_cycles and --drop-source would then delete the entire live downtime_cycles collection - now refused by an explicit source-shape guard in BOTH planRename and dropSource; (2) --drop-source gated on document CONTENT, so any legitimate ST rename of a Story during the burn-in permanently blocked the drop (and therefore cm-2b) with no override - now gates on ID existence only, with the content checks kept where they belong, in applyRename's copy phase. Also: a new --prefer-new recovery mode for the both-fields deploy window (all three review layers flagged it), a real client bug where a plain 404 on delete told the ST the Story was still in use, a scoped $rename, a label-coercion fix, main() argv coverage, two non-discriminating E2E assertions strengthened, and four documentation corrections (incl. the false 'local mongod' claim - the suites ran against tm_suite_test ON the live Atlas cluster, name-guarded not air-gapped). 4 findings deferred to deferred-work.md, 3 dismissed on evidence. Regression: vitest 144/144 across the 6 suites (was 120), 0 skipped; Playwright unchanged against the confirmed pre-existing 13 CM-1-drift reds. MERGED 2026-08-16 (PR #1186, after resolving the cross-branch conflict with cm-4a's PR #1185, which landed first). LIVE --apply RUN 2026-08-16: chapters -> story_cycles copy done and confirmed idempotent (3 copied/relabelled, 7 downtime_cycles field renames, re-run showed 0/0/0), live app now reads story_cycles. --drop-source deliberately NOT run - chapters preserved as the rollback copy. Burn-in is SCHEDULED, not abstract: no realistic way to exercise the Cycle tab's Story grouping before Game 8 (2026-09-19) under normal play, so the live test is an ST using the Cycle tab for real ~1 week out, around 2026-09-12, non-destructively (no special test mode needed, app already reads story_cycles). Only after that: --drop-source --apply, which frees 'chapters' for cm-2b. Do not create cm-2b's story before that's happened. cycle-model.md §11a "Status as of 2026-08-16" carries the same note.
