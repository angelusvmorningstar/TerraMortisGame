  # untouched (the issue says so outright). Read surface is a minimal ST-only
  # GET /api/write_once_violations, deliberately without st_mod_audit's
  # pagination/faceting - this is a rare-event log, not a stream. No UI panel:
  # the issue's own AC3 allows "as simple as a read endpoint".
