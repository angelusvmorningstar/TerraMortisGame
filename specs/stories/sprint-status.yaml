t without the tracker ever being loaded first, so trackerRead() silently returned seeded MAX defaults (the gdx-7 bug) - AC4 requires ensureLoaded(character) awaited BEFORE trackerRead(charId) for exactly this reason, since this story is a second call site touching the same cache. Race-guard for overlapping resolve calls (AC6) reuses this codebase's own established generation-counter shape (office-tab.js's _officeManoeuvreGen / pending-queue.js's own fetch-generation discipline) rather than inventing a new one. What this story is NOT: does not modify /accept's own logic; does not touch roll-v2.js's pool-building state; does not fix .rv2-again-seg's own light-theme contrast defect (deferred separately, see deferred-work.md's "Deferred from: crd.3b design-lock" entry); does not implement crd.4's formula; does not touch challenge-initiation.js; does not generalise the merit-bonus lookup beyond Indomitable/Closed Book; adds no new character-data GET. NOT dev-storied yet - dev-story is the next phase whenever picked up. Story: crd-3b-client-resolution-screen.md.

