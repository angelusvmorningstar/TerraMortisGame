jacency = 21 files: 255 passed, 0 failed, 0 skipped, 14 files passed, 7 files FAILED TO LOAD. All 7 load failures proven pre-existing by git stash push -u of this story's 3 new files and re-running the same 7 against the unmodified base (identical 7 failures, "no tests"), then stash pop with all 3 files verified restored. Two were already documented (n8-mandragora-prereq per dbo-9, oxp-1-office-seats' shebang failure per oxp-11); the other FIVE share the same SyntaxError: Invalid or unexpected token symptom and appear undocumented (issue-1013-indomitable-rules-text, issue-1021-failed-breakpoint-merit, issue-811-sumchannels-rootcause, issue-826-cleanup-script-integration, issue-837-xp-totals-deprecation) - all five newly logged to deferred-work.md as CLAUDE.md candidates, with the observation that one shared root cause across seven unrelated files is likelier than seven bugs. #1115 is NOT in this gate and was not run: n7-n9-allocator-readers.test.js imports from neither server/schemas/ nor server/scripts/, so it is outside the changed area. BARE DRY-RUN against live tm_suite (read-only, blessed by the story's own Dev Notes) reported exactly "30 document(s) / 442 fact(s) need a fact_key" and "0 fact(s) stamped" - matching the inventory. --apply was NEVER passed at any target, live or test; the only writes anywhere were applyBackfill({apply:true}) inside vitest against tm_suite_test. server/package.json unchanged (randomUUID from node:crypto needs no dependency). British English, no em-dashes, no smart quotes, no NUL bytes verified programmatically across all three new files. RESIDUAL HAZARD logged to deferred-work.md rather than scope-crept: _havens-and-locations.js:46  a fact with no fact_key, so re-running that one-off after the backfill reintroduces a keyless fact - same class as dbo-1's seed-rules-necropolis finding. HAND-OFF OWED: when Angelus runs the backfill with --apply against live tm_suite (his action, after the 2026-08-15 game), TM WIKI MUST BE TOLD THE MI