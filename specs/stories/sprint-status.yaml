7 green: (1) Patch 1 reverted alone (position loop back to row.indices, validity check kept) failed EXACTLY the new reorder test, 26 passed; (2) Patch 2 reverted alone (both layers back to presence) failed EXACTLY the new invalid-key test, 26 passed; (3) Patch 5 protected behaviour inverted (single-field $set replaced with a whole-fact $set dropping revealed_to, the write shape _havens-and-locations.js uses) failed EXACTLY the AC6 byte-for-byte test, precisely at the new revealed_to assertion, 26 passed - proving the new fixture discriminates real behaviour rather than merely passing. Unicode sweep re-run clean across all three source files. LIVE tm_suite NOT written to during the review - no --apply at any target, only applyBackfill({apply:true}) inside vitest against tm_suite_test. NOT committed, NOT pushed, NOT merged - Angelus call. HAND-OFF UNCHANGED AND STILL OWED: when Angelus runs the backfill with --apply against live tm_suite (his action, after the 2026-08-15 game), TM WIKI MUST BE TOLD THE MINT HAS LANDED so they can backfill-verify and decide when to flip wiki_config.fact_level_enabled. DBO-7 unblocked on this dependency. Prior entry follows. DEV COMPLETE 2026-08-14, all 6 tasks done, NOT committed, NOT reviewed. Three new files, nothing else in this repo changed: server/schemas/character_dossier.schema.js (draft-07, additionalProperties:false at BOTH document and fact level, exporting characterDossierSchema + DOSSIER_TAGS(26) + DOSSIER_FACT_SOURCES(4) + DOSSIER_SEVERITIES(3)), server/scripts/dbo-2-dossier-fact-key-backfill.mjs (planBackfill/applyBackfill/main, dry-run default, backup-before-write with abort-on-backup-failure, no shebang, MONGODB_DB override, auto-run guard, collection passed as an argument), and server/tests/dbo-2-dossier-fact-key.test.js (one combined suite matching DBO-1 precedent - 25 tests: 14 Ajv schema, 3 export/import-contract, 8 tm_suite_test-backed script). LIVE INVENTORY RE-DERIVED rather than trusted, and it matched the story