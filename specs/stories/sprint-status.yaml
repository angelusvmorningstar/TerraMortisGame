ed regression 321 passed / 0 failed / 0 SKIPPED (real mongod present, so the accept transaction was genuinely exercised); a wider 16-file sweep of every suite touching a changed file 419 passed / 0 failed. Prove-discriminated 3x (budget check disabled -> red; claim moved below the purchase write -> red; the three guard widenings -> red before, green after) - with an honest note that MongoDB transaction retry already serialises concurrent accepts, so claim-first is defence in depth and the STATIC ordering test is what pins it. One pre-existing crd-2-pending-queue timeout flake (7-11s vs the 5s default on a full public/js walk) investigated and cleared 3 ways incl. git stash -u A/B. One oxp-4 assertion updated (the pinned _wireMeritDots signature, legitimately widened by requestState); the other two oxp-4 structural guards it tripped were fixed in the SOURCE, not the test. Live-verified end to end through the real running app on port 8081 + plain node index.js, deliberately against tm_game_test NOT live tm_game (this story WRITES purchases; fixtures cleaned up after) - request controls, submit + toast, one-pending-per-seat UI lockout, queue row, accept moving the balance by exactly 1, decline writing nothing, the unaffordable disabled state reusing oxp.6 reasons, no leak to a reference view, zero console errors. DISCLOSED NOT VERIFIED LIVE: the player-holder auth branch (local-test-token hardcodes role st + empty character_ids, so every browser submit took the ST branch) - covered by Supertest only; and no status_action row co-rendered beside a purchase row (same caveat gdx.12 recorded), covered by the _renderRow-untouched static test + oaq-3 green. NOT committed, NOT pushed. CODE REVIEW ROUND 2026-08-27 (external Codex, 3 isolated CLI-direct passes at high reasoning effort; raw findings at specs/stories/code-review/oxp-9-*-codex-findings-pass{1,2,3}.md; findings came from OUTSIDE the session, not self-discovered). 0 High. 4 Medium + 5 Low. PATCHED 6, DISMISSED 3, DEFERRED 1 (client busy-lock UX, logged to deferred-work.md). Patched: (1) the one-pending-per-seat findOne+insertOne race - pass 2 REPRODUCED a real double spend (12-request burst -> 10 pending rows -> 2 dots on one merit), fixed with a partial unique index on {seat_id} filtered to office_purchase+pending in server/index.js beside oaq.2's own, plus an 11000-to-409 translation, findOne kept as a fast path only; the story's own AC3 reasoning ('not a multi-actor budget race') was simply wrong. (2) seat office_category drift between submit and accept - pass 2 reproduced a Head of State Resources request being applied under Primogen's rules; now a 409. (3) STRICT re-validation - pass 3 reproduced a below-cap stepper move (0->1, cap 5) being applied on top and landing on 2; ANGELUS RULED STRICT (409 on any intervening change, not just cap-crossing), so POST now stores submitted_from and accept 409s on any difference, before the budget check and before the claim. (4) malformed stored manoeuvre rank - pass 1 reasoned this statically with no mongod; REPRODUCED DYNAMICALLY HERE FIRST (rank -5 -> HTTP 200 with outcome to:-4/left_after:11 while storage held 0; rank 'bad' -> bare HTTP 500, request stranded pending). Decision: REFUSE a non-finite or negative stored rank (409 at accept, 400 at submit) rather than silently coerce to 0, citing office-xp.js's own Number.isFinite convention and going one step further because an accept WRITES a number back. (5) non-array character_ids -> controlled 403, was an uncaught 500. (6) the atomicity test was regex-only; a REAL behavioural test added with no test-only production hook (a scalar `dots` field makes MongoDB reject the purchase write after the claim; asserts the claim rolls back). Dismissed: merit:null on a manoeuvre request (deliberate, disclosed, knowingly kept); AC5's literal step ordering (the implemented order is SAFER - never resolves before re-validating - code unchanged, but the Dev Agent Record's false 'is the order the story