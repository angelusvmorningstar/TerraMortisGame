oordinator fixture, and two pre-existing broken harnesses (#n-more and #btn-desktop-toggle, both confirmed broken at base). Post-patch: 19 passed (3 primary specs), 5 passed (feat.17), 56 passed (server, real runs). POST-REVIEW: the tickets COLLECTION (69 docs) was dropped 2026-08-11 on Angelus's explicit authorisation, as a separate action AFTER the review closed - the story itself shipped code-only as specified. Drop was guarded on live count matching the export (69=69); recovery path is data/exports/tickets-full-export-2026-08-11.json. The 19 open tickets (real unfixed bugs) were deliberately NOT converted to GitHub issues - Angelus declined. MERGED AND DEPLOYED 2026-08-11: commit b8094fd5 -> PR #1136 -> main d6f641d7, issue auto-closed, Netlify + Render deployed from main. Story: issue-1135-delete-eight-tabs.story.md

