  crd-1-data-lock-schema-hardening-wp-spike: done                # CODE REVIEW CLOSED 2026-08-22, review -> done. EXTERNAL Codex review (3-pass blinded adversarial protocol; findings persisted unedited at specs/stories/code-review/crd-1-codex-findings.md) — nothing below was found by this story's own dev pass. Both HIGH findings were REPRODUCED LIVE against the real running route before a line was patched, not accepted on the reviewer's authority: creating a request with no defender_pool (newly valid per this story's own AC1) and then calling PUT /:id/accept really did return HTTP 200 with defender:{pool:null,successes:0,rolls:[]} and outcome:'attacker' — the defender silently losing the contest on zero dice, because _roll's Math.max(0, undefined) is NaN so the roll loop never runs. TWO PATCHES APPLIED, each prove-discriminated ALONE (never combined, route file byte-compared back to identical after each restore): (1) PUT /:id/accept now returns 409 CONFLICT — matching the route's own existing 409 'no longer pending' convention — when defender_pool is null/absent, leaving the record pending with no session_logs entry. Deliberately an INTERIM BLOCK, not resolution logic: crd.3a's resolve endpoint is what will ever populate the pool for real, and until then refusing an unresolved request is safe where silently rolling zero dice is not. Guard is `== null` not falsy, so a legitimately-computed defender_pool:0 still accepts; it runs after the ownership check so a non-target still gets 403; decline is deliberately NOT guarded since a defender may always refuse. Revert-alone result: 1 failed/41 passed, the failure being exactly the live repro. (2) POST / now strips attacker-supplied defender_aspect/defender_wp_spent/defender_merit_ids AFTER the ...req.body spread, the same way request_type is force-set after it — these are the DEFENDER's own submitted choices and letting the attacker assert them at creation is the same injury as the attacker-writable defender_pool this whole epic exists to remove. AC3's literal wording ('they only ever get populated later, by crd.3a, not by this story or by POST /') is now TRUE AS WRITTEN and needed no amendment. Revert-alone result: 3 failed/39 passed, all three the new provenance tests. Two pre-existing tests in this story's own suite had codified the old unsafe behaviour and were rewritten to assert schema-acceptance only. Suite 34 -> 42 passed/0 failed; changed-area regression re-run over 11 suites (the dev pass's 10 plus cm-2b-chapters-route-and-dual-read, which Codex correctly identified as an omitted server/index.js reader) 377 passed/0 failed, i.e. exactly +8 over the 369 pre-patch baseline with no new failures; the cm-4 5s-timeout flake did not reproduce this run. THREE FINDINGS DEFERRED, NOT PATCHED, all logged to specs/deferred-work.md under this story's own block and each wanting its own story: (a) both new createIndex() promises in server/index.js are discarded un-awaited with no .catch(), and the Dev Agent Record's claim that a non-unique index 'cannot reject at build time' is simply wrong (option conflicts, permissions and dropped connections all reject) — left alone because it is a shared boot-path convention the pre-existing oaq.2 index follows too, so it wants one consistent pass rather than a one-off; (b) _findChallenge and PUT /:id/void still use $ne:'status_action' while GET /mine was upgraded to the positive $in:[null,'contested_roll'] — default-allow, so a hypothetical fourth request family in this shared collection could be resolved/declined/voided by contested-roll routes, the same implicit-discriminator fragility that produced the oaq.3 void-orphaning bug, left half-fixed (Task 3's own wording explicitly permitted keeping $ne, so this is an inconsistency inside crd.1's own spec); (c) the parent epic (~line 100) requires a SERVER-DERIVED game_session_id on creation and explicitly forbids a client-supplied one, and POST / never added it — NOT resolved here and deliberately not implemented, this NEEDS ANGELUS'S OWN SCOPE DECISION on whether it belongs retroactively in crd.1 or in crd.2/crd.3a where session provenance is actually consumed (note either way that every crd.1-created document will lack it, and that the otc-2 deferred entry already logs office_actions' own game_session_id as a spoofable client-supplied string this epic must not reproduce). NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. Story created 2026-08-22 (bmad-create-story). Re-verified every file the epic doc cited rather than trusting its summary — two real findings sharpened the story's own scope beyond the epic file's own text: (1) contested_roll_request.schema.js's required array includes BOTH challenger_pool AND defender_pool, and no request_type field exists anywhere on plain contested-roll docs (it's simply absent, not defaulted) — this project has already been burned once by exactly this kind of implicit-discriminator fragility (the office_actions/contested_roll_requests void-orphaning bug), so this story makes request_type:'contested_roll' explicit going forward rather than continuing to rely on absence; (2) the WP+2-vs-+3 spike is answered, not deferred — public/js/suite/roll-v2.js:207's `const wpBonus = state.WP ? 3 : 0` is a single shared literal used by every roll type in the real app, confirming crd.3a/3b must never branch that shared file and instead build a fully independent WP-spend control for the resolution screen, only handing off to roll-v2.js (or its Epic RLV successor — see below) for the mechanical dice-roll-and-display step once a final_pool number already exists. Also formally supersedes nav-6-contested-roll-design (see that row's own correction note above under Epic Unified Nav Polish) and flags a forward-looking cross-epic note for whoever writes crd.3b later: Epic RLV (dice roller harmonisation) is actively in-progress consolidating roll.js/roll-v2.js — crd.3b should target RLV's post-rlv.2 end state, not the legacy roller. Story: crd-1-data-lock-schema-hardening-wp-spike.md. DEV-STORY COMPLETE 2026-08-22, in-progress -> review: schema required-array drop + four new optional properties, POST / sets request_type:'contested_roll' after the body spread, GET /mine scoped with request_type:{$in:[null,'contested_roll']} (a REAL gap - it previously had no request_type clause at all and was safe only because office-actions.js happens to write target_id rather than target_character_id; the positive $in filter also keeps a hypothetical fourth request_type out, which $ne:'status_action' would not), _findChallenge and PUT /:id/void PROVED correct across legacy/new/status_action fixtures and deliberately left unchanged, plus a crd1_defender_queue compound index and a 30-day crd1_terminal_status_ttl index in server/index.js. New suite 34/34; changed-area regression 332/333 with the one failure (cm-4-renumber-chapter-merge's 5s-timeout test) proved pre-existing both by passing 136/136 in isolation and by failing identically with every change stashed. TWO FINDINGS FOR A FOLLOW-UP, not fixed here: (1) the TTL index is INERT - MongoDB only expires BSON Date values and every writer on this collection stores new Date().toISOString(), a string, so the index is correct but reaps nothing until updated_at becomes a real Date (cross-route data-shape change plus a backfill, explicitly out of crd.1 scope; pinned by a test that fails the day the type changes); (2) the 30-day retention window is AC7's own recommendation, now named in code, comment and test rather than buried - confirm or change it. WP spike CONCLUDED: roll-v2.js:207's shared wpBonus=3 literal is used by every roll type, so crd.3a/3b must build an independent WP control and never branch that file; roll-v2.js was not opened for editing. AC9/nav.6 was already satisfied by the create-story step and only verified here. NOT committed, NOT pushed, NOT merged.

  crd-2-player-facing-pending-queue: done                        # CODE REVIEW CLOSED 2026-08-22, review -> done. EXTERNAL Codex review (3-pass blinded adversarial protocol; findings persisted unedited at specs/stories/code-review/crd-2-codex-findings.md), NO HIGH FINDINGS. Every finding was independently re-verified against the real code before a line was patched, and two changed shape as a result: a direct grep of every checkMoreBadge() call site in app.js confirmed all four (post-Feeding ~:550, boot ~:1543, the definition, one self-call from _markSubViewed) are unreachable from pending-queue.js's own poll tick, and Codex's "the test record reports Mongo-skipped gates as fully passed" finding did NOT reproduce - the suite really is 50/50 with MongoDB reachable, Codex's 48/50 was its own sandbox hitting EACCES on port 27017, so the dev pass's original record stands unamended. FOUR PATCHES APPLIED, each prove-discriminated ALONE (never combined, restored and re-confirmed green after each): (1) initPendingQueue(rootEl, chars, onQueueChange) now takes an optional callback fired after any poll that actually changes the pending set, and goTab injects checkMoreBadge at the mount site - INJECTION not import, because app.js already imports FROM pending-queue.js and the reverse would be circular. Without it the shared #more-badge went stale in BOTH directions while a player had the Challenges tab open (lit after the queue emptied, dark after a poll discovered new work) until some unrelated action re-triggered it. Gated on a real membership change rather than firing every tick, respecting the same resource-conscious principle the poll gate exists for; a throwing callback is caught so a badge failure cannot take the poll loop down. Revert-alone: 3 failed/56 passed. (2) _refetchAndRender's failure branch now clears state.resolved instead of leaving it untouched - the module's "one tick" promise is about the tick immediately following a SUCCESSFUL fetch, and the old code held a dimmed, untappable "Resolved" row through any number of consecutive failed polls. state.rows (the real pending work) still survives a blip, unchanged. Revert-alone: 1 failed/58 passed. (3) A @media (max-width: 599px) block for .cq-row in suite.css, the same phone breakpoint #bnav and the Status ranking drawer already use, giving the action cluster its own line under the challenger name. MEASURED in real Chromium at 390px, not asserted: before, row.scrollWidth 450-477 against a 342px clientWidth, the challenger-name column collapsed to 0px, and the action cluster's right edge 135px past the row's; after, 342/342 with a 288px name column and the cluster inside the row. Verified by a temporary Playwright spec that was deleted afterwards (matching how Codex cleaned up its own probes); a source-level tripwire test remains in the vitest suite. (4) Story frontmatter branch corrected from ms/crd-1-data-lock-schema-hardening-wp-spike to ms/crd-2-player-facing-pending-queue. FOUR FINDINGS DEFERRED, NOT PATCHED, all logged to specs/deferred-work.md under this story's own block and each named against its Codex finding: (a) renderDesktopSidebar() never evaluates app.badge for ANY MORE_APPS entry, so a desktop player sees no pending-challenge signal at all - REAL but PRE-EXISTING and cross-cutting (the Downtime tile has always been badge-less on desktop too), and the dev pass had already found and correctly declined it for the same reason; wants its own story covering every badged entry at once, not a one-off on the newest tile; (b) a challenge arriving after boot never lights the badge for a player who never opens the tab - NOT A BUG, a deliberate trade-off falling straight out of this epic's own scoping principle (do not poll while nobody is looking at the surface), logged so it is a chosen boundary rather than an unnoticed gap, and explicitly NOT to be worked around with a global always-on poll - WebSocket broadcast is the right shape if a live signal for an unopened tab is ever genuinely wanted; (c) refreshPendingQueueBadge() writes state.rows without joining _fetchGen, so a slow boot request can overwrite a newer tab-open snapshot and make the next diff fabricate or resurrect a row - real, but a narrow race with low reachability, and its fix extends the same generation discipline crd.3b will be editing anyway; (d) three assertions in the suite are source-text checks labelled as behavioural proofs (goTab context forwarding, cq- class completeness, colour-token discipline) - genuinely weaker than their names, NOT rewritten because the honest fix is a real DOM harness and this repo has no jsdom (a new dependency is a HALT condition); flagged for whoever next touches the file. Codex's two Pass-3b evidence-gap findings (the red-first chronology not being reproducible from the committed range, and the absolute "zero live writes anywhere" attestation not being establishable from a client-side fetch shim) reviewed and recorded as NON-ACTIONABLE - they concern the completeness of the historical record, not defects in current code, and no retroactive proof was attempted. Suite 50 -> 59 passed/0 failed (9 new tests, confirmed red first; the two Mongo-backed AC6 tests RAN rather than skipped); changed-area regression re-run over the same 16 suites: 488 passed/0 failed, exactly +9 over the 479 pre-patch baseline with no new failures; Playwright pair (issue-1015-hide-challenge-rename-ordeals-xp, issue-1135-deleted-tabs) 15/15 unchanged. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. bmad-dev-story COMPLETE 2026-08-22, ready-for-dev -> in-progress -> review. Standalone public/js/game/pending-queue.js (NOT public/js/player/ - that directory does not exist on disk; the epic doc's suggested path was wrong, real precedent is game/), tab-active-gated 10s poll (measured live: 0 requests over 25s while the tab was inactive), multi-character-safe per-row "Defending as" labels, resolved-but-recent row driven by departure from the pending set rather than a local mutation. NO Accept/Decline button on a queue row, deliberately - accepting needs a resolved pool (crd.1's 409 guard) and both mutations belong beside crd.3b's pool. goTab() extended additively to goTab(t, ctx) and dispatches a new contested-resolve tab with { challengeId }; its destination is an honestly-labelled placeholder whose tests assert the ABSENCE of crd.3b's surface so the scope line cannot be crossed quietly. challenge-notification.js DELETED (this project's unbroken precedent for superseded client modules, checked against git log --diff-filter=D); its ONE live call site replaced by a boot-time badge refresh, and its never-called stopChallengePoller import went with it. Removed a real pre-existing #more-badge ownership clash between the old poller's inline style.display writes and checkMoreBadge's class toggle. New suite 50/50 (confirmed red first); changed-area regression 16 suites 479/479; nav-related Playwright specs 15/15. Browser-verified end to end with ZERO live-data writes (populated states via a client-side fetch shim, never a real contested_roll_requests document); two real spacing defects found only in the browser and fixed. FLAGGED for another epic, not fixed here: deleting the module leaves Epic RLV's rlv.5 and specs/dice-roller-harmonisation-audit.md citing a file that no longer exists (rlv.5's job shrinks from three consumers to two). Finding 2 stands and matters for sequencing: contested rolls remain DORMANT in production - nothing in any live UI creates one - so this story does not make the feature reachable on its own, and the attacker side must NOT be re-enabled before Finding 3 (challenge-initiation.js still asks the attacker for the defender's pool) is fixed. NOT committed, NOT pushed, NOT merged. Story created 2026-08-22 (bmad-create-story), depends_on crd.1 (done). Re-verified every file cited rather than trusting the epic doc's summary — two real findings sharpen this story's own scope and urgency framing beyond what the epic file anticipated: (1) challenge-notification.js's EXISTING modal is already structurally broken by crd.1's own schema change — it unconditionally renders challenge.defender_pool as "Your pool" and its Accept button calls PUT /:id/accept with no way to submit a resolved pool, so for any contested-roll document created the new intended way (no defender_pool supplied) it would literally show "Your pool: undefined" and Accept would always 409 against crd.1's own new guard; this story does not merely soften an interrupt into a calmer list, it replaces a flow crd.1 has already made non-functional for its own future documents. (2) contested rolls are not currently creatable through ANY live UI as far as a full-repo grep this story ran can find — challenge-initiation.js (the only client code anywhere that POSTs to /api/contested_roll_requests) is reachable only via goTab('challenge'), and nothing anywhere calls goTab('challenge') any more; its MORE_APPS tile was removed with a code comment ("Challenge tile hidden (#1015)... remain wired for future programmatic use"), leaving the wiring orphaned. This softens urgency (not an active live regression for real players today, since nothing currently creates a challenge outside a direct API call or a test) without changing scope. Also found and flagged, NOT fixed here: challenge-initiation.js still has a manual "Their pool (defender)" number input, submitted verbatim as defender_pool on every POST — the exact attacker-writable-defender-pool injury this whole epic exists to remove, still live in the one module that creates these documents, un-hidden or not; flagged for whichever future story re-enables the challenge tile (likely paired with crd.3a/3b). Decisions locked into the story: standalone new module per the epic's own Decision 3 (no relitigating); REPLACES challenge-notification.js's modal-popup behaviour outright rather than coexisting with it, since coexistence would mean shipping a UI that shows undefined and a button that always fails; the queue's "tap to resolve" action routes to a real, working, honestly-labelled PLACEHOLDER screen via an explicit context-id-carrying routing contract, since crd.3a/3b (the real resolve endpoint and resolution screen) don't exist yet — crd.2's whole job is to build a working door crd.3b can put a real room behind later, not to build the room; multi-character defenders get an explicit per-row "which character" label (character_ids is a real array, and the one existing app pattern that resolves "my character" via .find() on the first match is explicitly NOT acceptable here, a second character's pending challenge would be silently invisible); nav placement is MORE_APPS's existing 'player' section (app.js:1673-1699) reusing the downtime entry's own live badge:()=>{...} callback pattern, not a new NAV_ITEMS bottom-bar tile. Story: crd-2-player-facing-pending-queue.md.

  crd-4a-defensive-status-choice: done                           # CODE REVIEW CLOSED 2026-08-26, review -> done. External Codex CLI review, a rocky run (corrupted local models cache killed two attempts, session-resume failed to continue and had to fall back to independent one-shot passes) that also made an unauthorised server/db.js TLS change and left a leftover probe test file - both caught during bookkeeping, reverted/deleted, verified clean, full detail in the story's own Senior Developer Review section. THREE PATCHES, each prove-discriminated ALONE: (1) defender_status_term added to POST /'s attacker-field strip list (Medium - the schema grew the field but the existing strip-list was never updated, letting an attacker pre-populate a bogus "defender's choice"); (2) a non-finite pool total is now treated as "not resolved yet" rather than silently persisting as NaN, which defeated /accept's own null-pool guard the same way crd.1's original bug did (High as demonstrated, narrow reachability - blood_potency is schema-constrained to an integer through normal API paths); (3) session-selection for the at-Court check switched from attendance.js's own unfiltered sort to office-actions.js's session_date<=today + _id tie-break pattern, since a future-dated game_sessions document (a real supported shape) could otherwise silently outrank the live session (Medium). Also hardened attendedIn's id-matching defensively (not separately prove-discriminated, confirmed not currently reachable). ONE FINDING DISMISSED AS PRE-EXISTING WITH EVIDENCE: a reviewer-labelled "High" resolve-vs-resolve race, reproduced live via the reviewer's own mocked-DB probe, but confirmed via git show against the base commit to be the identical unconditional-updateOne shape already present for every other defender-owned field before this story - deferred-work.md's own existing TOCTOU entry already analysed this exact route and judged the resolve-vs-resolve case specifically safe; this finding re-confirms rather than contradicts that conclusion, no deferred-work.md change needed. ONE FINDING DISMISSED MATCHING PRIOR PRECEDENT: AC10's token-only wording vs raw px spacing, identical to a finding crd-3b's own review already dismissed (no spacing-token scale exists in this design system). FIVE STORY-TEXT WORDING CORRECTIONS, no code change needed (implementation was already correct): AC1 byte-for-byte overstatement, AC6 over-broad no-.on-ever wording, AC9 omits-vs-null, AC12 stale disabled-Roll reference, Task 9 test count. Test results: crd-4a suite 19 -> 22 (3 new, prove-discriminated); full changed-area regression 195/195, 0 failed. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. DEV-STORY COMPLETE 2026-08-26 (bmad-dev-story), ready-for-dev -> in-progress -> review. All 9 tasks implemented. Server gate (_statusChoiceEligibility in contested-rolls.js) reuses currentCycleInGamePhase/calcEffectiveCityStatus/findRegentTerritory exactly as office-actions.js already does, mirrors attendance.js's own live "at Court" lookup (not a new mechanism, not an internal HTTP self-call), short-circuits on power_name first so the common non-power /resolve path touches no extra collections. status_choice rides the existing response object (not persisted); defender_status_term persists on the document and was added to the schema. Client renders the gated section only on status_choice.eligible, never pre-selects either option, discards the selection the moment a later response reports the gate closed. AC8 CORRECTED DURING IMPLEMENTATION: the story as originally written said the Roll button should be client-disabled while a term is outstanding - writing the test surfaced a direct conflict with crd-3b's own AC7 (no client-side duplicate of the server's null-pool guard, verified by reading contested-resolve.js's own canAccept computation directly: !state.resolving && !state.accepting, no pool term at all) - fixed both the code (label-only) and the AC8 text itself in the story file rather than silently diverging. CSS ported from the locked mockup, purely additive, including a dedicated .cr-pool-pending rule so the placeholder text does not inherit the numeral's display font (var(--fh), Cinzel) per this app's own type rule. New suites: crd-4a-defensive-status-choice.test.js 19/19 (every one of the three gate conditions tested failing alone, City-Status-higher requirement, effective-City-Status capped at 10 per side before the difference is taken, status_choice value computation, required-when-eligible null-pool behaviour as NOT a 400, persisted defender_status_term including the null-when-never-open case, re-resolve overwrite not merge, 0-30 clamp still applying with a status term added); crd-3b-resolution-screen.test.js extended to 32/32 (9 new tests: gate-open/closed render branch, always-unselected initial state with the "Higher" pill as guidance only, placeholder/label messaging, generation-guarded selection call, gate-closes-mid-flow discard). Full changed-area regression (crd-1/crd-2/crd-3a/crd-3b/crd-4a/api-tracker-state/oaq-2/oaq-3/otc-2-office-actions/otc-2-city-status-calc): 249/249, 0 failed. ONE PRE-EXISTING, UNRELATED FAILURE FOUND: gdx-4-css-standards-grep.test.js's own "var(--token, fallback) sites" count assertion expects >=11 in suite.css, finds 10 - verified via git stash A/B, identical failure on the unmodified base branch, this story's own suite.css diff is purely additive (zero removed lines) so cannot be the cause; not investigated further. Live-verified both themes against the REAL shipped theme.css/components.css/suite.css via a temporary Playwright harness (deleted after use, matching crd-3b's own precedent) - placeholder correctly NOT in the display font, selected-state tint legible in both themes, "Higher" pill legible. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. Story created 2026-08-26 (bmad-create-story), backlog -> ready-for-dev, depends_on crd.3a (done) and crd.3b (done). Implements ONLY the defensive half of crd.4 (Angelus's 2026-08-26 ruling): when defending against a power (challenge.power_name set), at Court (both challenger and defender attended:true in the current game_sessions document — confirmed by Angelus 2026-08-26 after this story was created), with game mode active (current Chapter phase 'game', via currentCycleInGamePhase, the exact import server/routes/office-actions.js already uses for its own GATED_TYPES gate), and the defender's calcEffectiveCityStatus strictly higher than the challenger's, the defender is offered an explicit choice between their Blood Potency and the City-Status difference — never pre-selected, a small "Higher" pill is guidance only. Design-locked same session (Sally) via a real Playwright-verified mockup, public/mockups/crd-4-defensive-status-choice-mockup.html (both themes) — caught and fixed a real design-system violation during design-lock itself: the first draft's empty-state placeholder text ("Choose above") used the display font (Cinzel, var(--fh)), which this app's own type rules reserve for numerals only, never words; switched to the same label style (var(--fl)) the surrounding section labels already use. LOAD-BEARING RESEARCH FINDING: the three gate conditions are NOT new server logic to invent — currentCycleInGamePhase and calcEffectiveCityStatus/findRegentTerritory are both already used server-side for exactly this shape by office-actions.js (lines ~159-169, ~316-319), and the "at Court" attendance check mirrors server/routes/attendance.js's own live, currently-shipped mechanism (the same one public/js/tabs/downtime-form.js already calls to show its own Attended/Absent badge) — most-recent game_sessions document by session_date, matched by character_id then character_name fallback. SECOND FINDING: since the challenger may be an NPC or another player's character the defender's own suiteState.chars has no document for, only the server can compute both sides' City Status — so status_choice (both term values, and whether the gate is even open) rides on the EXISTING PUT /resolve response crd-3b's screen already calls on every state change, rather than a new GET (this story adds none, matching crd-3b's own "no new GET" discipline exactly). THIRD FINDING: defender_pool's existing null-means-not-finalised-yet contract (crd-3b, no aspect chosen) is extended, not replaced — a second reason pool can be null is aspect chosen but the gate open and no defender_status_term submitted yet. Two open questions saved for dev-story per this skill's own "save questions for the end" instruction were both confirmed by Angelus immediately after story creation, same session: (1) "at Court" requires BOTH parties attended, not just the defender; (2) the power-check keys off power_name alone, no additional roll_type condition. New server field contested_roll_request.defender_status_term (enum 'bp'|'city', null when the gate never opened) added to contested_roll_request.schema.js, matching how defender_aspect etc. are already declared there for shape-completeness even though this route has no validate() middleware. What this story is NOT: does not implement the attack-penalty half (crd.4b, not yet created, pending Angelus's separate ruling after checking with Symon); does not touch challenge-initiation.js; does not change the Defensive Reaction pool for any contest outside the three-condition gate; does not add a City Status/BP term to the old standalone ST tool (public/js/game/contested-roll.js, its own independent "Com+BP" mechanic, untouched); does not generalise calcEffectiveCityStatus or currentCycleInGamePhase; adds no new HTTP GET. Story: crd-4a-defensive-status-choice.md. NOT dev-storied yet.

  crd-3a-server-resolve-endpoint: done                           # CODE REVIEW CLOSED 2026-08-23, review -> done. External Codex CLI review (3-pass blinded adversarial protocol, codex exec piped directly, model_reasoning_effort=high), no High findings, but five real Medium-equivalent findings this story's own dev pass missed - every one independently re-verified against real code before patching (a standalone Node probe reproduced the prototype-key bypass with no DB needed; a fresh local six-file run reproduced 172/172 exactly, settling the reviewer's own "unverifiable gates" claim as its sandbox losing MongoDB network access, the same pattern crd-1/crd-2's own reviews hit). FIVE PATCHES, each prove-discriminated ALONE: (1) ASPECT_ATTR[defender_aspect]'s truthy object lookup accepted inherited Object.prototype keys (toString/constructor/__proto__/hasOwnProperty) as valid aspects, computing a silent-zero pool and persisting an off-enum value - fixed with an explicit ASPECT_KEYS.includes() allowlist check before ASPECT_ATTR is ever indexed (revert-alone: 4 failed/30 passed). (2) AC9's literal "do not accept defender_wp_spent as anything other than a boolean" was violated - a non-boolean value was silently coerced to false and accepted with 200, since this PUT route has no validate() middleware (POST-only) - fixed with an explicit typeof check, 400 on anything present but non-boolean (revert-alone: 1 failed/33 passed). (3) A tracker_state document that EXISTS but omits willpower (the collection's own PUT route is an unvalidated partial upsert) defeated the live-positive-Willpower check, since undefined <= 0 is false - fixed by falling through to the live max on a missing FIELD, not just a missing DOCUMENT, via trackerDoc?.willpower ?? _willpowerMax(character) (?? not ||, so a genuine willpower:0 still holds) (revert-alone: 1 failed/33 passed). (4) Two character merit rows sharing one rule_key - a data anomaly no schema prevents - double-counted the bonus, since the sum loop walked every character row rather than every resolved key - fixed by looking up ONE merit per resolved rule_key via .find() (revert-alone: 1 failed/33 passed). (5) No clamp to the collection's own declared 0-30 defender_pool domain - attrObj.bonus and merit.rating both have no declared maximum (only dots is capped at 10), so a schema-valid character could drive the computed pool past 30 through this validate()-free write path - fixed with a defensive Math.max(0, Math.min(30, pool)) (revert-alone: 1 failed at the hand-computed unclamped value of 47, 33/34 passed). ONE FINDING DEFERRED to deferred-work.md: the check-then-blind-write TOCTOU race between /resolve and /accept/decline/void (no status re-check in any of the four routes' final updateOne filters) is PRE-EXISTING across the whole file since crd.1, not introduced or worsened by this story - the correct fix touches all four routes uniformly, which is its own scoped cross-cutting story, not a one-off patch to /resolve alone. TWO FINDINGS DISMISSED WITH EVIDENCE: the lack of local try/catch around awaited DB calls matches every other route in the same file (established convention, not a crd.3a-specific defect); the "unverifiable gates" finding, settled by the fresh local re-run above (172/172 and 182/182 both reproduced exactly - the reviewer's own sandbox denied network access to MongoDB entirely). ONE BOOKKEEPING CORRECTION: api-tracker-state.test.js genuinely has 8 tests, not the originally-recorded 9 (six-file total unaffected). crd-3a suite 24 -> 34 (10 new tests covering every patch); six-file changed-area regression 172 -> 182, 0 failed. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. DEV-STORY COMPLETE 2026-08-22 (bmad-dev-story), ready-for-dev -> review. All 7 tasks implemented: new PUT /:id/resolve on contested-rolls.js reusing _findChallenge for the 404/409 guards and the same ownership-check shape as /accept and /decline. Deliberately did NOT import public/js/data/accessors.js's getAttrEffective/calcWillpowerMax - confirmed those pull in browser-coupled state (bloodlines-cache.js, the rule-engine cache) unsuitable for a server route - and instead wrote two tiny local dots+bonus helpers reading straight off the live character document. Live Willpower re-check reads tracker_state directly (getCollection('tracker_state'), mirroring tracker.js's own dual-form character_id filter): the FIRST server route to read this collection directly rather than just passing it through, since st_mods.js only documents where the CLIENT splices it in. No tracker_state document at all defaults to full undamaged Willpower, matching the client's own defaults() fallback rather than treating a missing tracker as zero. Merit bonuses are summed by walking the character's OWN merits[] filtered to validated rule_keys, not the submitted id list, so a duplicated id in the request body can never double-count a bonus - a robustness property that fell out of the implementation shape rather than needing its own explicit check. One defensive addition beyond the story's own ACs: an off-enum defender_aspect now gets 400 VALIDATION_ERROR (ordered AFTER the ownership check, so a wrong owner still gets 403 first) rather than silently producing a NaN/0 pool - no PUT route in this file validates its body via the JSON-schema middleware (POST-only), so this is a small inline guard. New suite (crd-3a-resolve-endpoint.test.js) 24/24 passing against real MongoDB. Changed-area regression across crd-1/crd-2/crd-3a/api-tracker-state/oaq-2/oaq-3: 172/172 on a clean re-run - one transient 5s timeout in crd-2's own "no other client module still references it" filesystem-walk test on the FIRST combined run, reproduced as a pass-in-isolation and a pass on an immediate re-run of the same combined set, concluded a pre-existing parallel-load timing flake in a synchronous fs.readdirSync walk (this story touches no client file at all) rather than a regression. Two load-bearing patches prove-discriminated individually with single-change reverts: changing +2 to +3 failed exactly 3 tests (the direct bonus assertion, the re-resolve idempotency total, restored); disabling the currentWp<=0 guard failed exactly 1 test (the 409-on-zero-WP case, restored). NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. Story created 2026-08-22 (bmad-create-story), depends_on crd.1 (done). Server-only, no client surface — a new PUT /:id/resolve on contested-rolls.js, unit-testable entirely via Supertest, no UI/Playwright needed. Re-verified every cited file rather than trusting the epic doc's own crd.3a sketch, which turned out to be stale on the biggest point: the epic originally proposed writing a `resolution` sub-document, but crd.1, as actually built, added defender_pool/defender_aspect/defender_wp_spent/defender_merit_ids as FLAT fields on the existing schema instead — this story writes into that real, already-tested shape, not a sub-document that was never built. Confirmed crd.1's own accept-route 409 guard is NOT deleted by this story despite its own code comment suggesting otherwise ("delete this guard when crd.3a lands") — that comment is imprecise; the guard's real invariant (accept cannot roll dice for an unresolved defender) stays true forever, since nothing stops a client calling /accept directly without ever calling this story's own resolve endpoint first. THE LOAD-BEARING FINDING of this story's research pass: the epic's own "no merit-specific conditional logic, gate off generic merit fields" requirement assumed infrastructure that does not exist. Read character.schema.js's real merit object (445-707) directly — category/name/rating and a long tail of narrow-purpose fields, but NO generic field anywhere encodes a merit's bonus VALUE or which roll it modifies. This project does have a real typed rule-engine (server/schemas/rules/ — rule-derived-stat-modifier, rule-disc-attr, rule-grant, rule-nine-again, rule-skill-bonus, rule-speciality-grant, rule-status-floor, rule-tier-budget), reachable from a merit's real rule_key, but NONE of the existing rule types cover "adds dice to a contested/Resistance roll" (rule-derived-stat-modifier's own target_stat enum is size/speed/defence/health/willpower_max only). The epic's own crd.3a sketch was written assuming this generic infrastructure already existed; it doesn't. This story's own scope call: ship a narrow, explicitly-named 2-merit lookup (Indomitable flat +2, Closed Book +rating — the two merits the disposable mockup already proved correct), NOT a new rule-engine type — that generalisation is real, scoped, convention-following future work (a genuinely bigger story than this one), not silently folded in here. A third merit needing this lookup extended IS the RLOG shape the epic warned about, but building the proper fix now would blow a server-only "should be quick" story into something much bigger; flagged plainly rather than either silently scope-creeping or silently under-delivering. Also locked in: resolving is explicitly NOT accepting (status stays 'pending', /accept — unmodified by this story — is still the separate action that rolls dice); re-resolving before accept is deliberately ALLOWED and idempotent (full recompute-and-overwrite each call, no partial-merge risk, unlike accept's genuinely irreversible dice roll) so a defender can iterate their choices; WP re-checked LIVE at resolve time (not cached), correctly +2 not +3, citing crd.1's own established Rulebook citation rather than re-deriving it; merit ids validated against the character's REAL merits[] keyed on rule_key (crd.1's own finding — not name); an unowned/stale merit id degrades silently to "not selected" rather than a hard validation failure. Story: crd-3a-server-resolve-endpoint.md.

