  crd-3b-client-resolution-screen: done                          # CODE REVIEW CLOSED 2026-08-23, review -> done. External Codex CLI review, no High findings, but found more than crd-3a's own round - including a genuine AC8 failure this story's own Dev Notes had wrongly recorded as "nothing new to test." SIX PATCHES, each prove-discriminated ALONE: (1) a _mountGen counter, bumped every mount, checked in _resolve/_accept/the WP-load callback - _resolveGen alone only ordered resolves WITHIN one mount, so a stale call from a PRIOR mount (even for a different challenge) could coincidentally pass its generation check against a fresh mount that hadn't yet issued its own resolve call, and _accept had no such guard at all. (2) try/catch around both apiRaw calls - a REJECTED (not just non-OK) promise previously left resolving/accepting latched true forever with no recovery. (3) canAccept no longer duplicates the server's own null-pool gate - AC7 explicitly forbids this client-side duplicate, and the shipped state.pool != null condition made the route's own 409 unreachable from this screen. (4) AC8 actually fixed: new markChallengeResolved(id) export on pending-queue.js, called on a successful accept, splicing the row into the SAME one-tick "resolved" treatment _departedRows already gives a row leaving the pending set any other way - without it, a just-accepted challenge kept rendering as a normal tappable row (a 409 waiting to happen) until the next poll, indefinitely on a failed one. (5) defensive esc(String(...)) on margin/successes/challenger_pool - schema-constrained today, cheap to close regardless. (6) strengthened a test that asserted only innerHTML.length > 0. ONE FINDING DEFERRED to deferred-work.md: schema-valid duplicate merit rule_key rows render duplicate, visually-linked chips - a narrow data-anomaly echo of the same gap crd-3a's own review already fixed on the bonus-correctness side. THREE FINDINGS DISMISSED WITH EVIDENCE: calling /resolve before an aspect is chosen would only ever 400 (deliberate, not an oversight); the new CSS's literal spacing/font-size values match this project's own design system, which has no spacing-token scale at all; the "no retained screenshot evidence" observation, correct and expected for ephemeral verification steps. Independently re-verified gate numbers after the reviewer's own sandbox lost MongoDB access (same pattern crd-1/2/3a's reviews hit): 229/229 pre-patch, 234/234 post-patch. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. DEV-STORY COMPLETE 2026-08-23 (bmad-dev-story), in-progress -> review. contested-resolve.js rewritten in full behind its own extended signature (initContestedResolve(rootEl, ctx, chars)); app.js's call site updated additively. Real pool preview calls crd.3a's /resolve on every aspect/WP/merit change with a generation-guard against stale responses; commit calls the unmodified /accept and renders the outcome via roll-v2.js's own mkColsEl plus its pre-existing .rote-blk/.rcnt/.rlbl verdict chrome (a second real reuse find made during implementation - roll-v2.js's own RESIST_MODE feature already has a two-sided dice-result display, reused rather than inventing a new one) - no client-side dice generation anywhere, proven by a dedicated source-scan test. CSS REUSE AUDIT during implementation found the locked mockup's own standalone wrapper classes (.cr-screen/.cr-head/.cr-summary/.cr-section-label/.cr-actions) duplicated existing production classes doing the same job - .stm-audit-root/-head/-sub (page chrome, already used by the placeholder this story replaces), .cq-resolve-body/.cq-actions (body layout), .ch-pools/.ch-pool-row (summary rows), .form-section-title (section labels) - swapped in, keeping only the genuinely new interactive controls (.cr-identity-banner, .cr-aspect-seg, .cr-wp-toggle, .cr-merit-row/.cr-merit-chip, .cr-pool-preview) as new CSS. Re-verified against the REAL shipped suite.css (not the mockup's own duplicate styles) with a Playwright screenshot in both themes - confirms the reuse swap composes correctly, which the mockup alone couldn't prove. Caught and fixed a real CLAUDE.md hard-rule violation before it shipped: two rendered-output strings used an em-dash (the missing-data message, the verdict success-count labels) - rewritten with commas/colons, code comments (exempt) left untouched. crd-2-pending-queue.test.js updated: 3 of its own tests, explicitly written to break the moment this story landed (asserting the old "coming soon" placeholder and its absence of pool-builder code), retired with an explanatory comment; its own vi.mock() block gained apiRaw (this story's new api.js dependency) plus new tracker.js/roll-v2.js mocks, both now transitively imported via contested-resolve.js and both declaring browser globals (location) at module scope that crash under plain Node - the exact same constraint gdx-7's own test file already solved for the identical import chain, mirrored here rather than reinvented. One test-only bug caught and fixed during red-green (not a production defect): a forgotten queued mock response produced an unhandled rejection, bisected via -t filtering to the exact test. New suite 19/19; full changed-area regression (crd-1/crd-2/crd-3a/crd-3b/tracker-state/oaq-2/oaq-3/gdx-7) 229/229. Live verification was explicitly scoped to a static harness against the real shipped CSS rather than a full live-app browser session (real OAuth/Mongo fixtures/WebSocket) - judged disproportionate given the design was already Playwright-verified pixel-for-pixel at design-lock; disclosed, not claimed as more than it was. NOT committed, NOT pushed, NOT merged. PRIOR ENTRY FOLLOWS. Story created 2026-08-23 (bmad-create-story), backlog -> ready-for-dev, depends_on crd.3a (done). Design-locked first (Sally, bmad-agent-ux-designer, same session) via a real Playwright-verified mockup at public/mockups/crd-3b-resolve-screen-mockup.html - those decisions are folded straight into the story, not re-derived